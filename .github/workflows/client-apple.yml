name: Apple client

# Builds the Apple GUI apps for personal testing, UNSIGNED.
#
# Two artifacts: an iOS arm64 IPA and a macOS arm64 DMG. Neither is signed, notarized
# or otherwise touched by an Apple identity, because this stage exists to produce
# something that can be RE-SIGNED later with a real certificate and provisioning
# profile. No certificate, provisioning profile, Team ID, App Store Connect key or
# apple-actions secret is used or required.
#
# # Relationship to client-macos.yml
#
# That workflow builds and fully verifies the sing-box CORE binary
# (dist/sing-box-darwin-arm64) and has done so for a long time. This one builds the
# GUI clients, which link that same fork through Libbox. They are deliberately
# separate: the core pipeline keeps its existing gates, and nothing here changes
# them. Neither workflow re-implements the other.
#
# # Why the app links THIS fork
#
# Before building the apps, Libbox.xcframework is generated from this repository's
# own experimental/libbox via `make lib_apple`, and the client's copy is verified
# to be that freshly built framework. If it were missing, the app would fail to link
# or, worse, link whatever was already there. Nothing downloads an upstream libbox.
#
# # Two products, ONE Apple source, one Libbox
#
# The iOS and macOS clients build the SAME Apple source at the SAME commit: the parent's
# `clients/apple` gitlink. There is no per-platform revision and no per-platform branch,
# because which UI a device shows is a runtime decision of the Apple source itself:
#
#     iOS / SFI     clients/apple @ gitlink   scheme SFI   iPhone -> Hako, iPad -> upstream
#     macOS / SFM   clients/apple @ gitlink   scheme SFM   upstream
#
# Libbox is built ONCE from this repository's commit and that same artifact is installed
# into both checkouts, so the core is identical and so is the client source; only the
# scheme, the destination and the platform-specific overlays differ.
#
# The two jobs resolve their source independently and then prove they agree -
# `apple-client-source.sh assert-shared-source` in both, and the macOS job re-checks its
# checkout against `sha ios`. A future edit that reintroduces a per-platform pin fails
# there rather than shipping two different UIs under one version.
#
# # Trigger
#
# Manual only for now. Building an IPA and a DMG takes far longer than the core
# pipeline, and it would be wasteful to run it for every Go commit. Once this is
# known-good, a path filter for Apple-related sources can be added.
on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'Build the iOS unsigned IPA'
        type: boolean
        default: true
      build_macos:
        description: 'Build the macOS arm64 DMG'
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Both jobs share these so the artifact names cannot drift between them.
  APPLE_SUBMODULE: clients/apple

jobs:
  # The ONE place this workflow is allowed to resolve the default Apple source.
  #
  # Every other job consumes `needs.resolve-apple-source.outputs.apple_client_sha`. That is the
  # whole point of this job: libbox, ios and macos run on SEPARATE runners with separate
  # workspaces, so the frozen state file that keeps one shell consistent cannot keep one WORKFLOW
  # consistent. Without this job the sequence
  #
  #     libbox resolves main -> A
  #     someone pushes  main -> B
  #     ios resolves    main -> B
  #
  # is possible, and one release would carry two Apple client commits.
  #
  # Resolution happens here once, is published as a job output, and is the single truth for the
  # run. A consumer that re-resolved would be able to disagree with it, so no consumer does.
  resolve-apple-source:
    name: resolve the Apple client source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apple_client_sha: ${{ steps.resolve.outputs.apple_client_sha }}
      apple_client_repository: ${{ steps.resolve.outputs.apple_client_repository }}
      apple_client_branch: ${{ steps.resolve.outputs.apple_client_branch }}
      apple_client_ref: ${{ steps.resolve.outputs.apple_client_ref }}
      apple_client_source_mode: ${{ steps.resolve.outputs.apple_client_source_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: resolve the Apple client source once
        id: resolve
        # `ls-remote` resolves the default revision and prints it WITHOUT freezing anything; here
        # it is what turns "main latest" into an exact commit that every later job is pinned to.
        # An explicit APPLE_CLIENT_REF / APPLE_CLIENT_SHA in the repository variables takes
        # precedence inside the script, so an override needs no change here.
        env:
          APPLE_CLIENT_REF: ${{ vars.APPLE_CLIENT_REF }}
          APPLE_CLIENT_SHA: ${{ vars.APPLE_CLIENT_SHA }}
        run: |
          set -euo pipefail
          # The resolver reads its configuration from the refs file; a repository variable is an
          # override ON TOP of it, which is how an older build is reproduced.
          out="$(./scripts/ci/apple-client-source.sh ls-remote)"
          sha="$(printf '%s\n' "$out" | tail -n 1)"
          case "$sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "FAIL: the resolver returned no commit SHA (got '$sha')" >&2; exit 1 ;;
          esac
          [ "${#sha}" -eq 40 ] || { echo "FAIL: '$sha' is not a 40-character SHA" >&2; exit 1; }

          # shellcheck disable=SC1091
          . release/apple-client-refs.env
          if [ -n "${APPLE_CLIENT_REF:-}" ]; then
            mode=explicit-ref
          elif [ -n "${APPLE_CLIENT_SHA:-}" ]; then
            mode=explicit-sha
          else
            mode=latest-main
          fi

          echo "config:  APPLE_CLIENT_REPOSITORY=$APPLE_CLIENT_REPOSITORY"
          echo "config:  APPLE_CLIENT_BRANCH=$APPLE_CLIENT_BRANCH"
          echo "resolved: $sha  ($mode)"
          {
            echo "apple_client_sha=$sha"
            echo "apple_client_repository=$APPLE_CLIENT_REPOSITORY"
            echo "apple_client_branch=$APPLE_CLIENT_BRANCH"
            echo "apple_client_ref=${APPLE_CLIENT_REF:-${APPLE_CLIENT_SHA:-}}"
            echo "apple_client_source_mode=$mode"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Apple client source resolved once for this run"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| \`APPLE_CLIENT_SHA\` | \`$sha\` |"
            echo "| repository | \`$APPLE_CLIENT_REPOSITORY\` |"
            echo "| branch | \`$APPLE_CLIENT_BRANCH\` |"
            echo "| mode | \`$mode\` |"
            echo
            echo "Every other job in this run is pinned to the SHA above and must not re-resolve."
          } >> "$GITHUB_STEP_SUMMARY"

  # Libbox is compiled ONCE per commit and shared by both GUI jobs and by the local publish.
  #
  # It is the most expensive step in the Apple pipeline and depends only on the source commit - no
  # Apple secrets - so building it per platform was duplicated work. The artifact carries a manifest
  # naming the parent commit it was built from, because the consumers must be able to prove the
  # framework matches the commit being released, not merely trust an artifact name. It records no
  # Apple client revision: the core does not depend on which UI branch links it, and the two
  # platforms deliberately use two different ones.
  libbox:
    needs: resolve-apple-source
    if: ${{ inputs.build_ios || inputs.build_macos }}
    runs-on: macos-latest
    timeout-minutes: 120
    outputs:
      artifact: ${{ env.LIBBOX_ARTIFACT }}
    steps:
      - name: check out with submodules
        uses: actions/checkout@v4
        with:
          # The Apple client is a git submodule pinned by this repository, and it has
          # its own nested submodule (Frameworks/Runestone) that the Xcode project
          # needs in order to resolve packages. `recursive` fetches both. The
          # revision must be the one this repository pins - never a newer upstream tip.
          submodules: recursive
          fetch-depth: 0

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: set up Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer" 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: install gomobile
        # gomobile is what produces the xcframework; it is not on the runner image.
        #
        # The version is NOT written here. It is read from the one declaration in
        # scripts/ci/gomobile-toolchain.sh, which also installs both binaries, adds
        # them to PATH, and proves from each binary's own `go version -m` that it
        # was built from the module and version it claims. The same script is what
        # the Makefile's lib_install target calls, so a local build and CI cannot
        # disagree about the toolchain.
        run: |
          set -euo pipefail
          ./scripts/ci/gomobile-toolchain.sh install apple

      - name: Apple regression tests
        # Cheap invariant checks for the failures that are otherwise silent: a signed build falling
        # back to unsigned, upstream identifiers left in place, entitlements cleared while signing,
        # a published artifact that does not belong to the commit being released, or the two Apple
        # platforms being wired to the wrong source branch.
        #
        # The macOS name check belongs in this list because the failure it guards is silent in
        # exactly the same way: the app builds, signs and uploads, and installs as sing-box. Here it
        # runs against its own fixtures; the assertions that need the real pinned macOS checkout run
        # in the macos job below, which has one.
        run: |
          set -euo pipefail
          ./scripts/ci/test-apple-signing.sh
          ./scripts/ci/test-apple-beta-publish.sh
          ./scripts/ci/check-apple-source-selection.sh
          ./scripts/ci/test-apple-macos-name.sh
      - name: verify the Apple submodule revision
        # The AUTHORITY is the Apple client repository, not this repository's gitlink, so this
        # gate compares the checkout against the RESOLVED source rather than against the
        # gitlink. Requiring the gitlink made every client release a two-repository operation:
        # the build could only mirror a submodule someone had already bumped by hand.
        #
        # The SHA comes from the resolve job's output, NOT from resolving again here. This job
        # runs on its own runner with its own workspace, so a local freeze cannot keep it in step
        # with the other jobs - only the job output can.
        #
        # The guarantee that matters is unchanged and still enforced: the tree that gets built is
        # the tree the run selected. What is gone is the requirement that the selected commit
        # equal the submodule pointer - reported instead, and fatal again under
        # APPLE_CLIENT_REQUIRE_GITLINK=1.
        env:
          APPLE_CLIENT_SHA: ${{ needs.resolve-apple-source.outputs.apple_client_sha }}
          APPLE_CLIENT_REPO_URL: ${{ needs.resolve-apple-source.outputs.apple_client_repository }}
          APPLE_CLIENT_BRANCH_NAME: ${{ needs.resolve-apple-source.outputs.apple_client_branch }}
        run: |
          set -euo pipefail
          # Freeze the run-wide SHA into this runner's workspace, so the scripts this job calls -
          # `checkout ios`, which needs one - read the SAME commit the resolver published instead
          # of asking the remote again. This is the bridge between the workflow-level freeze and
          # the per-workspace state file, and it is seeded, never re-resolved.
          mkdir -p build
          {
            echo "# Seeded by client-apple.yml from the resolve-apple-source job output."
            echo "APPLE_CLIENT_SHA=$APPLE_CLIENT_SHA"
            echo "APPLE_CLIENT_REPOSITORY=$APPLE_CLIENT_REPO_URL"
            echo "APPLE_CLIENT_BRANCH=$APPLE_CLIENT_BRANCH_NAME"
          } > build/apple-client-source.env

          recorded="$(git ls-tree HEAD "$APPLE_SUBMODULE" | awk '{print $3}')"
          actual="$(git -C "$APPLE_SUBMODULE" rev-parse HEAD)"
          echo "parent records:  $recorded"
          echo "checked out:     $actual"
          echo "resolved source: $APPLE_CLIENT_SHA  (from the resolve job)"

          # Move the tree to the resolved commit if it is somewhere else. The submodule
          # checkout lands wherever the gitlink points, which after this change is frequently
          # behind - so "not at the resolved commit" is the normal state, not an error.
          if [ "$actual" != "$APPLE_CLIENT_SHA" ]; then
            ./scripts/ci/apple-client-source.sh checkout ios >/dev/null
            actual="$(git -C "$APPLE_SUBMODULE" rev-parse HEAD)"
          fi
          if [ "$actual" != "$APPLE_CLIENT_SHA" ]; then
            echo "FAIL: the Apple source is at $actual but the run resolved to" >&2
            echo "      $APPLE_CLIENT_SHA. The build must use the tree that was selected." >&2
            exit 1
          fi

          if [ "$recorded" != "$APPLE_CLIENT_SHA" ]; then
            if [ "${APPLE_CLIENT_REQUIRE_GITLINK:-0}" = "1" ]; then
              echo "FAIL: the resolved source $APPLE_CLIENT_SHA is not the gitlink $recorded." >&2
              exit 1
            fi
            echo "note: the gitlink is $recorded and this build uses $APPLE_CLIENT_SHA; the"
            echo "      Apple client repository is the authority."
          fi
          echo "PASS: the Apple source is at the resolved commit $APPLE_CLIENT_SHA"

      - name: warm the Go module cache
        # gomobile prepends its own temporary GOPATH, and on a cold runner the whole
        # module graph would be fetched from inside that step. Downloading it here
        # keeps a slow or flaky proxy from looking like a build failure, and makes
        # the fetch its own step in the log.
        run: go mod download all

      - name: Apple signing preflight
        # In unsigned mode this prints SKIP. In development mode it fails with an
        # actionable message rather than letting xcodebuild produce an artifact
        # that installs and cannot connect.
        run: ./scripts/ci/check-apple-signing-environment.sh

      - name: build Libbox from this fork
        # This is the step that makes the app "ours": Libbox.xcframework is compiled
        # from this repository's experimental/libbox at the current commit and
        # installed into the Apple client. It never downloads a prebuilt libbox from
        # an upstream release.
        #
        # The script is used rather than `make lib_apple` because that target builds
        # upstream's full Apple matrix (ios,iossimulator,tvos,tvossimulator,macos),
        # and the amd64 iOS simulator slice cannot link against the pinned cronet-go,
        # which ships no ios_amd64_simulator library. This builds ios and macos only.
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./scripts/ci/build-apple-libbox.sh both

      - name: pack the Libbox artifact
        # The manifest is what makes the artifact attributable to a commit. The artifact name is
        # informative only; consumers validate against the manifest.
        #
        # It records the parent commit and nothing about the Apple client: both platforms link this
        # one framework and they build from two different Apple revisions.
        env:
          LIBBOX_ARTIFACT: jiejiebox-libbox-${{ github.sha }}
        run: |
          set -euo pipefail
          ./scripts/ci/apple-libbox-artifact.sh pack \
            "$APPLE_SUBMODULE/Libbox.xcframework" \
            dist/apple/libbox
          echo "Libbox artifact contents:"
          ls -la dist/apple/libbox

      - name: upload the Libbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-libbox-${{ github.sha }}
          path: dist/apple/libbox
          if-no-files-found: error
          retention-days: 30

  ios:
    if: ${{ inputs.build_ios }}
    # Two real data dependencies, neither of them a false serialization:
    #   resolve-apple-source - this job consumes its published SHA
    #   libbox               - this job downloads the artifact it produced
    needs: [resolve-apple-source, libbox]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: check out with submodules
        uses: actions/checkout@v4
        with:
          # The Apple client is a git submodule pinned by this repository, and it has
          # its own nested submodule (Frameworks/Runestone) that the Xcode project
          # needs in order to resolve packages. `recursive` fetches both. The
          # revision must be the one this repository pins - never a newer upstream tip.
          submodules: recursive
          fetch-depth: 0

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: set up Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer" 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: select the Apple client source
        # Both Apple products take their Swift source from ONE commit of the Apple client
        # repository. Which UI a device shows is the Apple source's own runtime decision - it
        # routes from the device idiom (iPhone Hako, iPad upstream, macOS upstream) - so the
        # parent selects only the revision, never a per-platform UI branch.
        #
        # The revision comes from the resolve job's output. This step does NOT call `resolve`,
        # because that would let this job reach a different answer than the run did - which is the
        # hazard the resolve job exists to remove.
        env:
          RESOLVED_SHA: ${{ needs.resolve-apple-source.outputs.apple_client_sha }}
          RESOLVED_REPOSITORY: ${{ needs.resolve-apple-source.outputs.apple_client_repository }}
          RESOLVED_BRANCH: ${{ needs.resolve-apple-source.outputs.apple_client_branch }}
          RESOLVED_MODE: ${{ needs.resolve-apple-source.outputs.apple_client_source_mode }}
        run: |
          set -euo pipefail
          mkdir -p build
          # Seed this runner's frozen state from the run-wide answer, so the scripts this job calls
          # read the same commit the resolver published rather than asking the remote again.
          {
            echo "# Seeded by client-apple.yml from the resolve-apple-source job output."
            echo "APPLE_CLIENT_SHA=$RESOLVED_SHA"
            echo "APPLE_CLIENT_REPOSITORY=$RESOLVED_REPOSITORY"
            echo "APPLE_CLIENT_BRANCH=$RESOLVED_BRANCH"
          } > build/apple-client-source.env

          # One Apple commit for the whole run, on both platforms. This is the invariant that
          # stops a release carrying two UI commits, and it is now checked against the run-wide
          # value rather than against two independent resolutions that merely agreed by luck.
          ./scripts/ci/apple-client-source.sh assert-shared-source
          {
            echo "APPLE_CLIENT_PLATFORM=ios"
            echo "APPLE_CLIENT_REPOSITORY=$RESOLVED_REPOSITORY"
            echo "APPLE_CLIENT_DIR=clients/apple"
            echo "APPLE_CLIENT_SHA=$RESOLVED_SHA"
            echo "APPLE_CLIENT_BRANCH=$RESOLVED_BRANCH"
            echo "APPLE_CLIENT_SOURCE_MODE=$RESOLVED_MODE"
            echo "APPLE_CLIENT_UI=iOS: iPhone Hako / iPad upstream (runtime routing)"
          } >> "$GITHUB_ENV"
          echo "iOS Apple source: $RESOLVED_BRANCH @ $RESOLVED_SHA in clients/apple  ($RESOLVED_MODE)"

      - name: verify the Apple submodule revision
        # Same rule as the libbox job's gate above: the RESOLVED source is what the build must
        # use, and the gitlink is a convenience that is reported rather than required. This job
        # exports APPLE_CLIENT_SHA to GITHUB_ENV when it resolves, so the value is already here.
        run: |
          set -euo pipefail
          recorded="$(git ls-tree HEAD "$APPLE_SUBMODULE" | awk '{print $3}')"
          actual="$(git -C "$APPLE_SUBMODULE" rev-parse HEAD)"
          echo "parent records:  $recorded"
          echo "checked out:     $actual"
          echo "resolved source: $APPLE_CLIENT_SHA"

          if [ "$actual" != "$APPLE_CLIENT_SHA" ]; then
            ./scripts/ci/apple-client-source.sh checkout ios >/dev/null
            actual="$(git -C "$APPLE_SUBMODULE" rev-parse HEAD)"
          fi
          if [ "$actual" != "$APPLE_CLIENT_SHA" ]; then
            echo "FAIL: the iOS source is at $actual but the selection resolved to" >&2
            echo "      $APPLE_CLIENT_SHA. The build must use the tree that was selected." >&2
            exit 1
          fi

          if [ "$recorded" != "$APPLE_CLIENT_SHA" ]; then
            if [ "${APPLE_CLIENT_REQUIRE_GITLINK:-0}" = "1" ]; then
              echo "FAIL: the resolved source $APPLE_CLIENT_SHA is not the gitlink $recorded." >&2
              exit 1
            fi
            echo "note: the gitlink is $recorded and this build uses $APPLE_CLIENT_SHA; the"
            echo "      Apple client repository is the authority."
          fi
          echo "PASS: the iOS Apple source is at the resolved commit $APPLE_CLIENT_SHA"

      - name: download the verified Libbox artifact
        uses: actions/download-artifact@v4
        with:
          name: jiejiebox-libbox-${{ github.sha }}
          path: build/apple-libbox

      - name: validate and install the Libbox artifact
        # Both GUI jobs install the SAME artifact, so the framework they sign is byte-identical by
        # construction rather than by both having run the same compiler. It is validated against the
        # parent commit only: the Apple UI branch does not determine the core.
        run: |
          set -euo pipefail
          ./scripts/ci/apple-libbox-artifact.sh validate build/apple-libbox \
            --parent-sha "${{ github.sha }}"
          ./scripts/ci/apple-libbox-artifact.sh install build/apple-libbox "$APPLE_CLIENT_DIR"

      # `go mod download all` used to run here. Nothing in this job compiles this
      # repository's Go code: Libbox arrives as the artifact the two steps above
      # download and install, and the Xcode build, the overlays and every check this
      # job runs are shell, python3 and xcodebuild. The step pulled the entire module
      # graph into a job that reads none of it, so it is gone.
      #
      # `setup-go` is deliberately KEPT: whether any Xcode build phase shells out to
      # `go` cannot be proven from this repository, because clients/apple is a
      # submodule. A phase that did would resolve its own dependencies; downloading
      # the graph up front is not what makes that work.
      - name: Apple signing preflight
        # In unsigned mode this prints SKIP. In development mode it fails with an
        # actionable message rather than letting xcodebuild produce an artifact
        # that installs and cannot connect.
        run: ./scripts/ci/check-apple-signing-environment.sh

      - name: apply the personal-test overlay
        # Removes the multicast entitlement (not yet granted by Apple) and refuses to
        # continue if the extension's entitlements are not what this overlay expects.
        run: |
          set -euo pipefail
          ./scripts/ci/prepare-apple-client.sh

      - name: build unsigned IPA
        run: |
          set -euo pipefail
          ./scripts/ci/build-ios-ipa.sh dist/apple/SFI-unsigned.ipa

      - name: verify the signed artifact
        # In unsigned mode this prints SKIP. In development mode it checks each
        # nested code object, reads the SIGNED entitlements back, and compares them
        # against the embedded provisioning profiles - including that the app and
        # its extensions agree on one App Group.
        run: ./scripts/ci/verify-apple-signed-artifact.sh ios-ipa dist/apple/SFI-unsigned.ipa

      - name: name the artifact
        run: |
          set -euo pipefail
          version="$(cat release/JIEJIE_VERSION)"
          short="$(git rev-parse --short HEAD)"
          name="jiejiebox-ios-arm64-${version}-${short}-unsigned.ipa"
          mkdir -p dist/apple/out
          mv dist/apple/SFI-unsigned.ipa "dist/apple/out/$name"
          echo "IPA_NAME=$name" >> "$GITHUB_ENV"
          echo "IPA_PATH=dist/apple/out/$name" >> "$GITHUB_ENV"

      - name: BUILD-INFO and SHA256
        run: |
          set -euo pipefail
          eval "$(./scripts/ci/apple-signing-config.sh)"
          out="dist/apple/out"
          {
            echo "Jiejie sing-box Apple client build information"
            echo "============================================="
            echo "platform:               ios"
            echo "arch:                   arm64"
            echo "target:                 SFI"
            echo "version:                $(cat release/JIEJIE_VERSION)"
            echo ""
            echo "parent_repo:            https://github.com/Piggy-Cat-bit-shadow/sing-box"
            echo "parent_sha:             $(git rev-parse HEAD)"
            echo "libbox_source_sha:      $(git rev-parse HEAD)"
            echo ""
            echo "apple_repo:             $APPLE_CLIENT_REPOSITORY"
            echo "apple_branch:           $APPLE_CLIENT_BRANCH"
            echo "apple_sha:              $APPLE_CLIENT_SHA"
            echo "apple_sha_source:       parent clients/apple gitlink"
            echo "apple_client_dir:       $APPLE_CLIENT_DIR"
            echo "scheme:                 SFI"
            echo "ui_contract:            iPhone Hako / iPad upstream (runtime routing in the Apple source)"
            echo "libbox_source_sha:      $(git rev-parse HEAD)"
            echo "ui:                     $APPLE_CLIENT_UI"
            echo ""
            echo "build_time_utc:         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "xcode:                  $(xcodebuild -version | head -1)"
            echo "go_version:             $(go version)"
            echo ""
            echo "signing_mode:           $APPLE_SIGNING_MODE"
            echo "signing_style:          $APPLE_SIGNING_STYLE"
            echo "team_id:                ${APPLE_TEAM_ID:-N/A}"
            echo "base_bundle_id:         $APPLE_BASE_BUNDLE_ID"
            echo "app_group:              $APPLE_APP_GROUP_ID"
            echo "multicast_enabled:      $APPLE_ENABLE_MULTICAST"
            if [ "$APPLE_SIGNING_MODE" = "development" ]; then
              echo "provisioning_validation: PASS"
              echo "entitlement_validation:  PASS"
              echo "app_group_consistency:   PASS"
            else
              echo "provisioning_validation: N/A (unsigned)"
              echo "entitlement_validation:  N/A (unsigned)"
              echo "app_group_consistency:   N/A (unsigned)"
            fi
            echo "runtime_validation:     NOT EXECUTED"
          } > "$out/BUILD-INFO-IOS.txt"
          ( cd "$out" && shasum -a 256 "$IPA_NAME" > SHA256SUMS-IOS.txt )
          cat "$out/BUILD-INFO-IOS.txt"
          cat "$out/SHA256SUMS-IOS.txt"

      - name: upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: dist/apple/out
          if-no-files-found: error
          retention-days: 30

      - name: summary
        run: |
          set -euo pipefail
          eval "$(./scripts/ci/apple-signing-config.sh)"
          out="dist/apple/out"
          sha="$(awk '{print $1}' "$out/SHA256SUMS-IOS.txt")"
          size="$(wc -c < "$out/$IPA_NAME" | tr -d ' ')"
          {
            echo "### Apple Client Build - iOS"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| Parent SHA | \`$(git rev-parse HEAD)\` |"
            echo "| Apple repo | \`$APPLE_CLIENT_REPOSITORY\` |"
            echo "| Apple branch | \`$APPLE_CLIENT_BRANCH\` |"
            echo "| Apple SHA | \`$APPLE_CLIENT_SHA\` (parent gitlink) |"
            echo "| UI | $APPLE_CLIENT_UI |"
            echo "| Version | \`$(cat release/JIEJIE_VERSION)\` |"
            echo "| Xcode | \`$(xcodebuild -version | head -1)\` |"
            echo "| Go | \`$(go version | awk '{print $3}')\` |"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| target | SFI |"
            echo "| platform | iphoneos |"
            echo "| arch | arm64 |"
            echo "| PacketTunnel extension | present (verified) |"
            echo "| IPA | \`$IPA_NAME\` |"
            echo "| size | $size bytes |"
            echo "| SHA256 | \`$sha\` |"
            echo ""
            echo "| signing | |"
            echo "|---|---|"
            echo "| Signing mode | \`$APPLE_SIGNING_MODE\` |"
            echo "| Team ID | ${APPLE_TEAM_ID:-N/A (unsigned)} |"
            echo "| Base bundle ID | \`$APPLE_BASE_BUNDLE_ID\` |"
            echo "| App Group | \`$APPLE_APP_GROUP_ID\` |"
            echo "| Multicast | $APPLE_ENABLE_MULTICAST |"
            if [ "$APPLE_SIGNING_MODE" = "development" ]; then
              echo "| Provisioning validation | PASS |"
              echo "| Entitlement validation | PASS |"
              echo "| App Group consistency | PASS |"
              echo "| Network Extension entitlement | PASS |"
              echo ""
              echo "**Runtime Candidate: YES** — statically verified, not yet executed."
            else
              echo "| Provisioning validation | N/A |"
              echo "| Entitlement validation | N/A |"
              echo ""
              echo "> **UNSIGNED artifact — not a runtime candidate.**"
              echo ">"
              echo "> This validates that the app **builds, packages and has the right"
              echo "> structure**. It does **not** validate that the client can run:"
              echo ">"
              echo "> - Signing: UNSIGNED"
              echo "> - Runtime entitlement validation: NOT AVAILABLE"
              echo "> - App Group at runtime: NOT VALIDATED"
              echo "> - Network Extension / Packet Tunnel: NOT VALIDATED"
              echo ">"
              echo "> The upstream identifiers \`$APPLE_BASE_BUNDLE_ID\` are retained as"
              echo "> build inputs; this artifact is not an install or runtime signing"
              echo "> candidate. Re-run with \`APPLE_SIGNING_MODE=development\` and your"
              echo "> own Apple values to obtain one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  macos:
    if: ${{ inputs.build_macos }}
    # Same two real dependencies as the iOS job, and the two GUI jobs remain siblings: nothing
    # in either depends on the other.
    needs: [resolve-apple-source, libbox]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: check out the parent repository
        uses: actions/checkout@v4
        with:
          # Deliberately NOT `submodules: recursive`. The macOS product does not build from
          # the clients/apple gitlink - that is the iOS source, and materialising it here
          # would put the custom iOS UI on disk in a job that must never build it. The
          # macOS source is a different commit of the same Apple repository, checked out
          # below into build/apple-client-macos.
          submodules: false
          fetch-depth: 0

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: set up Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer" 2>/dev/null || true
          xcodebuild -version

      - name: install create-dmg
        run: |
          set -euo pipefail
          # This step USED TO ALSO install the gomobile toolchain (see the iOS/libbox job's
          # step for the invocation). That compiled gomobile and gobind from source - two
          # `go install`s of the pinned internal fork - for a job that never invokes either
          # tool. See this job's own note below: "This job compiles no Go from this repository:
          # Libbox is the shared artifact". The iOS/libbox job installs the toolchain because it
          # builds Libbox; this job downloads the verified artifact instead and only packages it.
          #
          # The toolchain is NOT needed to validate that artifact: apple-libbox-artifact.sh
          # checks the framework against the parent commit and the ABI probe, none of which
          # shells out to gomobile or gobind.
          #
          # create-dmg makes a Finder-friendly image. The script falls back to hdiutil if this
          # fails, so a brew hiccup cannot break the build.
          brew install create-dmg || echo "create-dmg unavailable; hdiutil will be used"

      - name: select the Apple client source
        # The macOS product builds the SAME Apple commit the iOS job builds. It must NOT resolve a
        # different one: the two UI families live in one tree now, and the Apple source - not this
        # workflow - decides which presentation a device gets. A per-platform revision here would
        # put the parent back in charge of UI ownership.
        #
        # The revision comes from the resolve job's output, so this job cannot reach a different
        # answer than the run did even if the client repository moves mid-run.
        env:
          RESOLVED_SHA: ${{ needs.resolve-apple-source.outputs.apple_client_sha }}
          RESOLVED_REPOSITORY: ${{ needs.resolve-apple-source.outputs.apple_client_repository }}
          RESOLVED_BRANCH: ${{ needs.resolve-apple-source.outputs.apple_client_branch }}
          RESOLVED_MODE: ${{ needs.resolve-apple-source.outputs.apple_client_source_mode }}
        run: |
          set -euo pipefail
          mkdir -p build
          {
            echo "# Seeded by client-apple.yml from the resolve-apple-source job output."
            echo "APPLE_CLIENT_SHA=$RESOLVED_SHA"
            echo "APPLE_CLIENT_REPOSITORY=$RESOLVED_REPOSITORY"
            echo "APPLE_CLIENT_BRANCH=$RESOLVED_BRANCH"
          } > build/apple-client-source.env
          ./scripts/ci/apple-client-source.sh assert-shared-source
          {
            echo "APPLE_CLIENT_PLATFORM=macos"
            echo "APPLE_CLIENT_REPOSITORY=$RESOLVED_REPOSITORY"
            echo "APPLE_CLIENT_DIR=build/apple-client-macos"
            echo "APPLE_CLIENT_SHA=$RESOLVED_SHA"
            echo "APPLE_CLIENT_BRANCH=$RESOLVED_BRANCH"
            echo "APPLE_CLIENT_SOURCE_MODE=$RESOLVED_MODE"
            echo "APPLE_CLIENT_UI=macOS: upstream (runtime routing)"
          } >> "$GITHUB_ENV"
          echo "macOS Apple source: $RESOLVED_BRANCH @ $RESOLVED_SHA in build/apple-client-macos  ($RESOLVED_MODE)"

      - name: check out the macOS Apple source
        # A copy of the pinned commit, never a branch tip and never a different revision: the
        # resolver refuses a gitlink that is unreachable or that is not on the reviewed branch, and
        # this step proves the resulting tree is the SAME commit the iOS job builds.
        run: |
          set -euo pipefail
          ./scripts/ci/apple-client-source.sh checkout macos
          ./scripts/ci/apple-client-source.sh verify macos
          actual="$(git -C "$APPLE_CLIENT_DIR" rev-parse HEAD)"
          shared="$(./scripts/ci/apple-client-source.sh sha ios)"
          if [ "$actual" != "$shared" ]; then
            echo "FAIL: the macOS job checked out $actual but both products must build $shared." >&2
            echo "      iOS and macOS share one Apple source; a per-platform revision is the" >&2
            echo "      two-source model this topology removed." >&2
            exit 1
          fi
          echo "PASS: macOS source is $actual, the same Apple commit the iOS job builds"

      - name: verify the pinned macOS source and the branding overlay
        # Deliberately BEFORE the build overlays and before Libbox is installed.
        #
        # The regression this workflow previously could not see: the iOS binding branded SFI
        # and nothing branded SFM, so the macOS product built, signed and uploaded as
        # sing-box. The check has two halves that need opposite states of the tree:
        #
        #   the PINNED source still declares the sing-box anchors the overlay rewrites, and
        #   the checkout is left exactly as the pin records it
        #
        #   ...both of which only hold while the tree is pristine, and
        #
        #   the overlay really does apply to a COPY of that pinned source and produce
        #   Jiejiebox there
        #
        # which is why the suite copies the checkout instead of branding it in place. Running
        # it after prepare-apple-client.sh would ask it to observe a pristine source the build
        # overlays had already rewritten, and it would fail on a correct build. The prepared
        # tree is asserted separately, in the next step but one.
        run: |
          set -euo pipefail
          ./scripts/ci/test-apple-macos-name.sh

      # No `go mod download all` here either - see the note in the ios job. This job
      # compiles no Go from this repository: Libbox is the shared artifact, and the
      # gomobile install above fetches its OWN toolchain module (`go install
      # github.com/sagernet/gomobile/cmd/gomobile@<version>`), which does not read this
      # module's graph or go.sum.
      - name: Apple signing preflight
        run: ./scripts/ci/check-apple-signing-environment.sh

      - name: download the verified Libbox artifact
        uses: actions/download-artifact@v4
        with:
          name: jiejiebox-libbox-${{ github.sha }}
          path: build/apple-libbox

      - name: validate and install the Libbox artifact
        # The SAME artifact the iOS job installs. The two frameworks are therefore
        # byte-identical by construction, rather than merely both produced from this commit.
        # Validation is against the parent commit only - the Apple UI branch does not decide
        # the core, and the two platforms deliberately use different Apple revisions.
        run: |
          set -euo pipefail
          ./scripts/ci/apple-libbox-artifact.sh validate build/apple-libbox \
            --parent-sha "${{ github.sha }}"
          ./scripts/ci/apple-libbox-artifact.sh install build/apple-libbox "$APPLE_CLIENT_DIR"

      - name: apply the build overlays
        # Compatibility shims for the client's libbox API, plus the
        # multicast-entitlement removal. Both are verified and fail closed.
        run: |
          set -euo pipefail
          ./scripts/ci/prepare-apple-client.sh

      - name: verify the prepared macOS app is branded
        # The other half of the name check: the suite above proved the overlay is right about
        # a copy of the pinned source, and this proves the PREPARED tree - the one that will
        # actually be archived - carries the result.
        #
        # The tree is expected to be dirty here. The overlays rewrite the working copy by
        # design and never commit to it, so this asserts the branded values and the untouched
        # neighbours rather than git cleanliness. The final proof is the archived bundle
        # itself, which check-macos-app-name.sh reads during the TestFlight build.
        run: |
          set -euo pipefail
          pbx="$APPLE_CLIENT_DIR/sing-box.xcodeproj/project.pbxproj"
          scheme="$APPLE_CLIENT_DIR/sing-box.xcodeproj/xcshareddata/xcschemes/SFM.xcscheme"

          echo "prepared macOS app name:"
          grep -n 'INFOPLIST_KEY_CFBundleDisplayName = "JiejieBox";' "$pbx"
          grep -n 'PRODUCT_NAME = "sing-box";' "$pbx"
          grep -n 'BuildableName = "sing-box.app"' "$scheme"

          # The overlay owns the visible name only. PRODUCT_NAME and the scheme remain
          # sing-box identity surface, while both SFM configurations show JiejieBox.
          display_values="$(grep -c 'INFOPLIST_KEY_CFBundleDisplayName = "JiejieBox";' "$pbx")"
          if [ "$display_values" != "2" ]; then
            echo "FAIL: expected SFM Debug and Release to declare JiejieBox as CFBundleDisplayName," >&2
            echo "      found $display_values values." >&2
            exit 1
          fi
          if [ "$(grep -c 'BuildableName = "sing-box.app"' "$scheme")" != "3" ]; then
            echo "FAIL: expected all three SFM scheme application buildables to remain sing-box.app." >&2
            exit 1
          fi

          # The neighbours this task must not touch.
          for untouched in 'PRODUCT_NAME = SFM;' 'PRODUCT_BUNDLE_IDENTIFIER = "$(BASE_PACKAGE_IDENTIFIER).standalone";'; do
            grep -qF "$untouched" "$pbx" || {
              echo "FAIL: the prepared tree no longer contains '$untouched'." >&2
              exit 1
            }
          done
          if grep -q 'PRODUCT_NAME = "Jijiebox"\|PRODUCT_NAME = "JiejieBox"\|PRODUCT_NAME = "Jiejiebox"' "$pbx"; then
            echo "FAIL: the macOS product identity was renamed instead of using the display name." >&2
            exit 1
          fi
          echo "PASS: the prepared macOS SFM app displays JiejieBox and keeps sing-box identity"

      - name: build unsigned DMG
        run: |
          set -euo pipefail
          ./scripts/ci/build-macos-dmg.sh dist/apple/SFM-unsigned.dmg

      - name: verify the signed artifact
        run: ./scripts/ci/verify-apple-signed-artifact.sh macos-dmg dist/apple/SFM-unsigned.dmg

      - name: name the artifact
        run: |
          set -euo pipefail
          version="$(cat release/JIEJIE_VERSION)"
          short="$(git rev-parse --short HEAD)"
          name="jiejiebox-macos-arm64-${version}-${short}-unsigned.dmg"
          mkdir -p dist/apple/out
          mv dist/apple/SFM-unsigned.dmg "dist/apple/out/$name"
          echo "DMG_NAME=$name" >> "$GITHUB_ENV"
          echo "DMG_PATH=dist/apple/out/$name" >> "$GITHUB_ENV"

      - name: BUILD-INFO and SHA256
        run: |
          set -euo pipefail
          eval "$(./scripts/ci/apple-signing-config.sh)"
          out="dist/apple/out"
          {
            echo "Jiejie sing-box Apple client build information"
            echo "============================================="
            echo "platform:               macos"
            echo "arch:                   arm64"
            echo "target:                 SFM.System"
            echo "notarized:              no"
            echo "version:                $(cat release/JIEJIE_VERSION)"
            echo ""
            echo "parent_repo:            https://github.com/Piggy-Cat-bit-shadow/sing-box"
            echo "parent_sha:             $(git rev-parse HEAD)"
            echo "libbox_source_sha:      $(git rev-parse HEAD)"
            echo ""
            echo "apple_repo:             $APPLE_CLIENT_REPOSITORY"
            echo "apple_branch:           $APPLE_CLIENT_BRANCH"
            echo "apple_sha:              $APPLE_CLIENT_SHA"
            echo "apple_sha_source:       parent clients/apple gitlink (the SAME commit the iOS job builds)"
            echo "apple_client_dir:       $APPLE_CLIENT_DIR"
            echo "scheme:                 SFM"
            echo "ui_contract:            upstream macOS (runtime routing in the Apple source)"
            echo "libbox_source_sha:      $(git rev-parse HEAD)"
            echo "ui:                     $APPLE_CLIENT_UI"
            echo ""
            echo "build_time_utc:         $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "xcode:                  $(xcodebuild -version | head -1)"
            echo "go_version:             $(go version)"
            echo ""
            echo "signing_mode:           $APPLE_SIGNING_MODE"
            echo "signing_style:          $APPLE_SIGNING_STYLE"
            echo "team_id:                ${APPLE_TEAM_ID:-N/A}"
            echo "base_bundle_id:         $APPLE_BASE_BUNDLE_ID"
            echo "app_group:              $APPLE_APP_GROUP_ID"
            echo "multicast_enabled:      $APPLE_ENABLE_MULTICAST"
            if [ "$APPLE_SIGNING_MODE" = "development" ]; then
              echo "provisioning_validation: PASS"
              echo "entitlement_validation:  PASS"
              echo "app_group_consistency:   PASS"
            else
              echo "provisioning_validation: N/A (unsigned)"
              echo "entitlement_validation:  N/A (unsigned)"
              echo "app_group_consistency:   N/A (unsigned)"
            fi
            echo "runtime_validation:     NOT EXECUTED"
          } > "$out/BUILD-INFO-MACOS-APP.txt"
          ( cd "$out" && shasum -a 256 "$DMG_NAME" > SHA256SUMS-MACOS-APP.txt )
          cat "$out/BUILD-INFO-MACOS-APP.txt"
          cat "$out/SHA256SUMS-MACOS-APP.txt"

      - name: upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: dist/apple/out
          if-no-files-found: error
          retention-days: 30

      - name: summary
        run: |
          set -euo pipefail
          eval "$(./scripts/ci/apple-signing-config.sh)"
          out="dist/apple/out"
          sha="$(awk '{print $1}' "$out/SHA256SUMS-MACOS-APP.txt")"
          size="$(wc -c < "$out/$DMG_NAME" | tr -d ' ')"
          {
            echo "### Apple Client Build - macOS"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| Parent SHA | \`$(git rev-parse HEAD)\` |"
            echo "| Apple repo | \`$APPLE_CLIENT_REPOSITORY\` |"
            echo "| Apple branch | \`$APPLE_CLIENT_BRANCH\` |"
            echo "| Apple SHA | \`$APPLE_CLIENT_SHA\` (pinned) |"
            echo "| UI | $APPLE_CLIENT_UI |"
            echo "| Version | \`$(cat release/JIEJIE_VERSION)\` |"
            echo "| Xcode | \`$(xcodebuild -version | head -1)\` |"
            echo "| Go | \`$(go version | awk '{print $3}')\` |"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| target | SFM.System |"
            echo "| platform | macos |"
            echo "| arch | arm64 |"
            echo "| DMG | \`$DMG_NAME\` |"
            echo "| size | $size bytes |"
            echo "| SHA256 | \`$sha\` |"
            echo "| notarized | no |"
            echo ""
            echo "| signing | |"
            echo "|---|---|"
            echo "| Signing mode | \`$APPLE_SIGNING_MODE\` |"
            echo "| Team ID | ${APPLE_TEAM_ID:-N/A (unsigned)} |"
            echo "| Base bundle ID | \`$APPLE_BASE_BUNDLE_ID\` |"
            echo "| App Group | \`$APPLE_APP_GROUP_ID\` |"
            echo "| Multicast | $APPLE_ENABLE_MULTICAST |"
            if [ "$APPLE_SIGNING_MODE" = "development" ]; then
              echo "| Provisioning validation | PASS |"
              echo "| Entitlement validation | PASS |"
              echo "| App Group consistency | PASS |"
              echo "| System Extension entitlement | PASS |"
              echo ""
              echo "**Runtime Candidate: YES** — statically verified, not yet executed."
              echo ""
              echo "| runtime check | result |"
              echo "|---|---|"
              echo "| App launch | NOT TESTED |"
              echo "| App Group container | NOT TESTED |"
              echo "| System Extension activation | NOT TESTED |"
              echo ""
              echo "A GitHub runner cannot activate a System Extension, which needs an"
              echo "interactive approval. Run \`scripts/ci/verify-macos-runtime.sh\` on"
              echo "your own Mac."
            else
              echo "| Provisioning validation | N/A |"
              echo "| Entitlement validation | N/A |"
              echo ""
              echo "> **UNSIGNED artifact — not a runtime candidate.**"
              echo ">"
              echo "> Build, packaging and architecture are verified; the client's"
              echo "> runtime capabilities are **not**:"
              echo ">"
              echo "> - Signing: UNSIGNED"
              echo "> - Runtime entitlement validation: NOT AVAILABLE"
              echo "> - App Group at runtime: NOT VALIDATED"
              echo "> - System Extension: NOT VALIDATED"
              echo ">"
              echo "> An unsigned \`SFM.System\` build mounts and has the right"
              echo "> architecture, but its App Group and System Extension do not"
              echo "> function. Re-run with \`APPLE_SIGNING_MODE=development\` for a"
              echo "> usable client."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
