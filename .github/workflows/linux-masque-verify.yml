name: linux-masque-verify

# The MASQUE end-to-end suite starts real sing-box instances and exercises the full
# sing-box -> sing-quic -> quic-go chain. Windows cannot run the PacketTooBig case (it fails
# identically on the pre-upgrade pin with an i/o timeout), so the transport-level proof runs
# here on Linux and is dispatched explicitly.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/go.sum
      - name: MASQUE unit and race
        run: |
          go test -race -count=1 -timeout 20m ./transport/masque ./protocol/masque
      - name: MASQUE end-to-end (H3 CONNECT-UDP/IP, PTB, fallback, reconnect)
        run: |
          cd test
          go test -count=1 -timeout 20m -run 'TestMASQUE' -v .
