name: Windows daemon tests

# Runs the Windows-only daemon security tests on a REAL Windows runner.
#
# # Why this workflow exists
#
# `experimental/boxdd/**` is the Windows daemon trust boundary: the named-pipe peer handshake, the
# executable and signer identity checks, and the Authenticode verdict. Its tests carry
# `//go:build windows`, so no Linux runner can execute them, and until this workflow existed **no
# workflow executed a single `go test` on a Windows runner at all** - `windows-core-amd64.yml` runs on
# `ubuntu-latest` and only cross-builds, and the two `windows-latest` workflows build, sign and audit an
# installer without ever compiling a test binary.
#
# The consequence was that eleven security tests ran nowhere in CI. `verify.yml` cross-compiles the
# package, so a change that broke COMPILATION would be caught; a change that broke BEHAVIOUR, including
# a relaxation of the signer identity check, would not be.
#
# # What this gate actually executes, and why each part matters
#
#   `TestTamperedSignedPEIsRejectedByTheFirstLayer` builds its own code-signing certificate and signs
#   its own PE at run time, then flips bytes inside the code section. It asserts the measured
#   `TRUST_E_BAD_DIGEST` is NOT tolerated. This is the test that proves the certificate-TIME relaxation
#   did not also relax signature INTEGRITY - the distinction the whole permission rests on.
#
#   `TestUnsignedFileIsRejectedByTheFirstLayer` drives the real `WinVerifyTrustEx` for a file with no
#   signature and asserts rejection. An unsigned file that were tolerated would let both endpoints
#   present a nil signer, and `bytes.Equal(nil, nil)` is true.
#
#   `TestWinTrustErrorClassificationIsAnAllowlist` + `TestAllowedErrorsAreExactlyTheTimeAndChainFamily`
#   pin the allowlist in BOTH directions, so it can neither silently grow nor lose a code it needs.
#
#   `TestCodeSigningEKUIsRequired`, `TestSignerPinDistinguishesTwoValidCertificates` and
#   `TestNilSignerCannotSatisfyThePin` cover the identity side.
#
# # Why `signtool` is a hard requirement here and not a skip
#
# The tamper and signed-fixture tests SKIP when `signtool.exe` is absent, which is correct for a
# developer machine but wrong for CI: a skip would make this gate green while proving nothing, and
# `SKIP is not PASS` is a rule this repository already states elsewhere. So the workflow locates
# `signtool` FIRST, fails if it cannot, and exports `SIGNTOOL` so the tests take the path they are
# meant to take rather than the skip. The SDK ships on the hosted Windows image under
# `Windows Kits\10\bin\<version>\x64\`.
#
# # Why the push trigger is path-filtered
#
# This workflow's only input is the daemon package and the files that decide whether it can build.
# Product source, docs and reports cannot change its verdict, and a push that touches none of the
# paths below does not need a Windows runner. `workflow_dispatch` is kept on purpose, for the same
# reason `release-contract-verify.yml` keeps it: a frozen SHA must be able to obtain this evidence on
# demand, and a `[skip ci]` dependency sync never triggers a push run.
#
# # Ownership
#
# This workflow owns no release-contract suite and invokes no `scripts/**` shell, deliberately: several
# of those have exactly one designated owner and `check-release-workflows.py` asserts that no second
# workflow runs them. It adds a test execution, not a second authority.

on:
  push:
    branches:
      - testing
      - "release/**"
    paths:
      - "experimental/boxdd/**"
      # The daemon's ldflags (and so its -X runtime.godebugDefault / ClientHello) come from
      # cmd/internal/build_shared; a change there must rebuild and re-test the daemon.
      - "cmd/internal/build_shared/**"
      - "cmd/internal/build_boxdd/**"
      # The memory ledger and its budget gate live in this workflow, so a change to the instrument,
      # to the budget it evaluates against, or to the study driver has to run it. Without these a
      # tightened budget or a changed gate merges without ever being executed (measured: a commit
      # touching only cmd/internal/memorystudy/** did not trigger this workflow).
      - "cmd/internal/memorystudy/**"
      - "scripts/dev/memory-study*"
      - "release/DEFAULT_BUILD_TAGS_WINDOWS"
      - "release/JIEJIE_VERSION"
      - ".github/workflows/windows-boxdd-tests.yml"
  pull_request:
    paths:
      - "experimental/boxdd/**"
      - "cmd/internal/build_shared/**"
      - "cmd/internal/build_boxdd/**"
      - "cmd/internal/memorystudy/**"
      - "scripts/dev/memory-study*"
      - "release/DEFAULT_BUILD_TAGS_WINDOWS"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The staged memory ledger and its budget gate, on the platform the budget was derived from.
  #
  # `cmd/internal/memorystudy` runs every case in its own child process and records a staged ledger of
  # a box's resident cost (parsing, construction, start, idle, probe, traffic, close). Its budget file
  # was derived from windows/amd64 measurements, so a Linux runner would take the platform-mismatch
  # branch for every rule and exit non-zero by design - which is why this job lives here and not in
  # verify.yml. `go test` (without -run '^$', which the package-execution gate does not count as
  # execution) covers the runner's own contract; the binary run covers the gate itself.
  memory-budget:
    name: staged memory ledger and budget gate (windows)
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: check out the source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: the runner's own contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 -timeout 15m ./cmd/internal/memorystudy

      - name: build the study binary with the product's tag profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tags = (Get-Content -LiteralPath release/DEFAULT_BUILD_TAGS_OTHERS -Raw).Trim() + ',with_purego'
          go build -tags $tags -o "$env:RUNNER_TEMP\memorystudy.exe" ./cmd/internal/memorystudy

      - name: prove the gate can fail
        shell: pwsh
        run: |
          # A gate that has never failed is not evidence that it can. The canary is a budget whose
          # single REQUIRED rule asks for a metric nothing produces, so the rule must report failed
          # evidence (not "skipped"), and the exit code must be non-zero: a zero exit here means the
          # evaluator, the ledger reader or the failure path regressed into "always green".
          $ErrorActionPreference = 'Stop'
          $canary = Join-Path $env:RUNNER_TEMP "budget-impossible.json"
          $canaryBudget = @{
            schema_version = 'memorystudy-budget/1'
            baseline       = @{ goos = 'windows'; goarch = 'amd64' }
            rules          = @(
              @{
                id          = 'canary-impossible'
                description = 'canary: required evidence that nothing produces must FAIL the gate'
                case        = 'empty'
                nodes       = 0
                groups      = 0
                node_proto  = 'direct'
                gc_mode     = 'forced'
                stage       = 'close'
                metric      = 'readings.this_metric_does_not_exist'
                max         = 1
                required    = $true
              }
            )
          }
          $canaryBudget | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $canary -Encoding utf8
          & "$env:RUNNER_TEMP\memorystudy.exe" -gate -runs 1 `
              -output "$env:RUNNER_TEMP\canary-gate.jsonl" `
              -budget $canary
          $canaryExit = $LASTEXITCODE
          if ($canaryExit -eq 0) {
            throw "the canary budget PASSED: the gate can no longer fail, so every other verdict is worthless"
          }
          Write-Output "canary failed as required (exit $canaryExit)"
          # The gate's non-zero exit is the EXPECTED result here, so the step must not inherit it:
          # GitHub appends `exit $LASTEXITCODE` to every pwsh step and a leftover 1 would fail the job.
          exit 0

      - name: evaluate the budget
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Three repetitions: the checked-in budget's baseline was derived from three, and the
          # thresholds are per-repetition. One run against a three-run baseline is a different
          # measurement (measured: 1 of 3 repetitions kept still reported 17 pass).
          & "$env:RUNNER_TEMP\memorystudy.exe" -gate -runs 3 `
              -output "$env:RUNNER_TEMP\memory-gate.jsonl" `
              -budget cmd\internal\memorystudy\testdata\budget.json
          $gateExit = $LASTEXITCODE
          # The gate can refuse BEFORE it writes its report (a missing run, a truncated ledger, two
          # identities in one file). In that case an artifact list of only the gate's own outputs would
          # be empty, and the upload step would be the only remaining witness of the failure - so the
          # exit code is written down unconditionally, in this step, before anything is thrown.
          "gate_exit=$gateExit" | Set-Content -LiteralPath "$env:RUNNER_TEMP\memory-gate.exit.txt" -Encoding utf8
          if ($gateExit -ne 0) {
            throw "the memory budget gate failed with exit code $gateExit; the ledger and its verdict are attached to this run"
          }

      - name: upload the ledger and its verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-budget-ledger
          path: |
            ${{ runner.temp }}/memory-gate.exit.txt
            ${{ runner.temp }}/memory-gate.jsonl
            ${{ runner.temp }}/memory-gate.jsonl.d/
            ${{ runner.temp }}/memory-gate.jsonl.gate.json
          # A run that produced NO evidence at all must fail: `warn` let a job that silently wrote
          # nothing stay green, which is the exact "green while proving nothing" shape this gate exists
          # to refuse. The exit marker above is written before any failure is thrown, so a FAILING gate
          # still uploads its diagnosis and only true silence fails here.
          if-no-files-found: error

  windows-daemon-tests:
    name: boxdd security tests (windows)
    # `windows-latest`, not `ubuntu-latest` with GOOS=windows. The distinction is the entire point of
    # this workflow: cross-compilation produces a binary, it does not execute Win32 or WinVerifyTrust.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: check out the source
        uses: actions/checkout@v4
        with:
          # The tests sign a PE at run time; they need the real tree, not a shallow copy of one file.
          fetch-depth: 1

      - name: set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: locate signtool and fail if the SDK is missing
        # A skip here would make the gate green while the tamper test proved nothing.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Braces are required: `$env:ProgramFiles(x86)` would be parsed as `$env:ProgramFiles`
          # followed by a literal `(x86)`, which silently looks in the 64-bit path.
          $kitsRoot = ${env:ProgramFiles(x86)}
          if (-not $kitsRoot) { $kitsRoot = $env:ProgramFiles }
          $root = Join-Path $kitsRoot 'Windows Kits\10\bin'
          $found = Get-ChildItem -Path $root -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '\\x64\\' } |
                   Sort-Object FullName -Descending |
                   Select-Object -First 1
          if (-not $found) {
            throw "signtool.exe was not found under '$root'. The tamper and signed-fixture tests would SKIP, and a SKIP is not a PASS for this gate. Install the Windows SDK on the runner image, or state explicitly that this gate no longer covers signed-PE behaviour."
          }
          "SIGNTOOL=$($found.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "signtool: $($found.FullName)"

      - name: confirm the tests are windows-only and actually present
        # Guards the failure mode where the build tag silently excludes every file, leaving a green
        # run that executed nothing.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path 'experimental/boxdd' -Filter '*_windows_test.go')
          if ($files.Count -eq 0) {
            throw "no *_windows_test.go files under experimental/boxdd; this gate would execute nothing."
          }
          Write-Host "windows test files:"
          $files | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: report the certificate tooling the tests depend on
        # The tamper test creates its own signing certificate. When that step fails, the ONLY useful
        # thing is the cause, and the first CI run reported "exit status 1" with no text at all. This
        # step prints the tooling facts up front so a failure is diagnosable from the log alone.
        #
        # The probe deliberately runs through `powershell.exe` WITH `-NoProfile -NonInteractive`,
        # because that is exactly how the Go test invokes it. A probe run under the workflow's own
        # `pwsh` proved nothing: `pwsh` auto-loads the PKI module, Windows PowerShell 5.1 under a
        # non-interactive profile did not, so the probe passed while the test skipped.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "workflow shell (pwsh): $($PSVersionTable.PSVersion)"
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          Write-Host "powershell.exe present: $(Test-Path $exe)"
          if (-not (Test-Path $exe)) {
            throw "powershell.exe not found at $exe; createStoreCertificate cannot run."
          }
          $probePath = Join-Path $env:RUNNER_TEMP 'boxdd-cert-probe.ps1'
          # The probe is written to a FILE rather than passed as a here-string. A PowerShell here-string
          # terminator must sit at column 0, which a YAML block scalar cannot express without ending the
          # scalar - so the here-string form silently leaves the string unterminated and the whole
          # workflow fails to parse. A file has no such constraint.
          @(
            '$ErrorActionPreference = ''Stop'''
            'Import-Module PKI -ErrorAction Stop'
            '$c = New-SelfSignedCertificate -Type CodeSigningCert -Subject ''CN=Jiejiebox CI Probe'' -CertStoreLocation ''Cert:\CurrentUser\My'' -NotBefore (Get-Date).AddMinutes(-5) -NotAfter (Get-Date).AddHours(1) -KeyUsage DigitalSignature -KeyExportPolicy Exportable'
            'Write-Output $c.Thumbprint'
            'Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($c.Thumbprint)" -Force -ErrorAction SilentlyContinue'
          ) | Set-Content -LiteralPath $probePath -Encoding utf8
          Write-Host "probe script:"
          Get-Content $probePath | ForEach-Object { Write-Host "  $_" }
          $result = & $exe -NoProfile -NonInteractive -File $probePath 2>&1
          $code = $LASTEXITCODE
          $result | ForEach-Object { Write-Host "  powershell.exe: $_" }
          if ($code -ne 0) {
            throw "the certificate probe FAILED through powershell.exe exactly as the test invokes it (exit $code). The tamper test would skip, and a SKIP is not a PASS for this gate."
          }
          if (-not ($result -match '^[0-9A-F]{40}$')) {
            throw "the certificate probe produced no thumbprint; the tamper test would skip."
          }
          Write-Host "certificate probe OK through powershell.exe"

      - name: mint the signing certificate the tamper test needs, and hand it over as a PFX
        # The test can create its own certificate, but it does so by spawning `powershell.exe`, and that
        # subprocess behaves differently from this shell: `Import-Module PKI` reports success there while
        # `-CertStoreLocation 'Cert:\CurrentUser\My'` still fails with DriveNotFound. The bare-subprocess
        # diagnostic above proves the drive IS reachable from powershell.exe launched here, so the
        # difference is specific to a process spawned from the Go test binary.
        #
        # Rather than keep chasing that, the certificate is minted ONCE here, in a shell that provably
        # works, exported as a PFX, and passed to the test through the environment. The test prefers a
        # supplied PFX and only falls back to creating its own - so this removes the fragile path from
        # CI entirely without removing the test's ability to run standalone.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PKI -ErrorAction Stop
          $password = [Guid]::NewGuid().ToString('N') + [Guid]::NewGuid().ToString('N')
          $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Jiejiebox boxdd CI Fixture' `
                 -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddMinutes(-5) `
                 -NotAfter (Get-Date).AddHours(2) -KeyUsage DigitalSignature -KeyExportPolicy Exportable
          $pfx = Join-Path $env:RUNNER_TEMP 'boxdd-fixture.pfx'
          $secure = ConvertTo-SecureString -String $password -AsPlainText -Force
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$($c.Thumbprint)" -FilePath $pfx -Password $secure | Out-Null
          if (-not (Test-Path $pfx)) { throw "the fixture PFX was not written" }
          Write-Host "fixture certificate: $($c.Thumbprint)"
          Write-Host "fixture PFX: $pfx ($((Get-Item $pfx).Length) bytes)"
          "BOXFDD_TEST_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BOXFDD_TEST_PFX_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: report whether the PKI provider drive exists in a bare subprocess
        # The Go tests spawn `powershell.exe` directly, with no inherited session and no profile. That
        # is a DIFFERENT environment from this workflow's own shell, and the difference has already
        # bitten twice: the `Cert:` drive is absent there even when `Import-Module PKI` reports success.
        # This prints what that subprocess can actually see, so the next failure is diagnosable from
        # the log rather than by inference.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $diag = Join-Path $env:RUNNER_TEMP 'boxdd-pki-diag.ps1'
          @(
            'Write-Output "PSVersion: $($PSVersionTable.PSVersion)"'
            'Write-Output "PSModulePath: $env:PSModulePath"'
            'Import-Module PKI -ErrorAction SilentlyContinue'
            'Write-Output "PKI loaded: $([bool](Get-Module PKI))"'
            'Write-Output "PKI module path: $((Get-Module PKI).Path)"'
            'Write-Output "Cert drive present: $([bool](Get-PSDrive -Name Cert -ErrorAction SilentlyContinue))"'
            'Write-Output "Cert PSProvider: $((Get-PSProvider -PSProvider Certificate -ErrorAction SilentlyContinue).Name)"'
            'Get-Module -ListAvailable PKI | ForEach-Object { Write-Output "available PKI: $($_.Version) $($_.Path)" }'
          ) | Set-Content -LiteralPath $diag -Encoding utf8
          Write-Host "--- bare powershell.exe -File diagnostics ---"
          & $exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $diag 2>&1 |
            ForEach-Object { Write-Host "  $_" }
          Write-Host "--- end diagnostics ---"
          exit 0

      - name: go vet the daemon package
        # A separate step so a compile problem is distinguishable from a test failure.
        #
        # The single pre-existing `possible misuse of unsafe.Pointer` finding in
        # authenticode_windows.go is expected, so this step fails only on a finding it does not know
        # about. Two details make that work on a Windows runner:
        #
        #   * output goes to a FILE, not through a PowerShell pipeline. `2>&1` into a variable wraps
        #     native stderr in a localized `NativeCommandError` record, so a naive line filter sees
        #     PowerShell's own error text as a finding and fails on every run.
        #   * only lines shaped `file:line:col:` count as findings, which ignores the package header
        #     and any wrapper text.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & go vet ./experimental/boxdd/ > vet.txt 2>&1
          $code = $LASTEXITCODE
          $findings = @(Get-Content vet.txt | Where-Object { $_ -match '\.go:\d+:\d+:' })
          if ($code -eq 0) {
            Write-Host "go vet: clean"
            exit 0
          }
          $known = 'possible misuse of unsafe.Pointer'
          $unexpected = @($findings | Where-Object { $_ -notmatch [regex]::Escape($known) })
          if ($unexpected.Count -gt 0) {
            $unexpected | ForEach-Object { Write-Host $_ }
            throw "go vet reported $($unexpected.Count) finding(s) other than the known one."
          }
          Write-Host "::notice::go vet: only the known pre-existing finding is present ($($findings.Count))"
          exit 0

      - name: build the daemon binary the acceptance probe drives
        # TestProductConfigurationRPCs runs the real daemon over its development TCP transport and
        # SKIPs unless BOXDD_ACCEPTANCE_BIN names that binary. Nothing else in CI builds it, so the
        # no-skip guard below could only ever fail: that is why this gate was red before this step
        # existed, with or without any product change.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -o boxdd-acceptance.exe ./experimental/boxdd
          if ($LASTEXITCODE -ne 0) { throw "go build ./experimental/boxdd failed ($LASTEXITCODE)" }
          if (-not (Test-Path 'boxdd-acceptance.exe')) {
            throw "the daemon binary was not produced; the acceptance probe would SKIP."
          }
          $binary = (Resolve-Path 'boxdd-acceptance.exe').Path
          "BOXDD_ACCEPTANCE_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "acceptance binary: $binary ($((Get-Item $binary).Length) bytes)"

      - name: run the daemon security tests
        # `-count=1` defeats the test cache, so a green run is a real execution rather than a replay.
        # Plain `go test` is used deliberately: these tests need no build tags (verified untagged and
        # under DEFAULT_BUILD_TAGS_WINDOWS), and an unnecessary tag set would be one more thing that can
        # silently deselect them.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -count=1 -v ./experimental/boxdd/ 2>&1 | Tee-Object -FilePath boxdd-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: fail on any SKIPPED security test
        # The tests skip when `signtool` is absent. `signtool` is required above, so a skip here means
        # something else went wrong and the gate did not actually prove what it claims.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $skips = Select-String -Path 'boxdd-tests.log' -Pattern '^\s*--- SKIP' -ErrorAction SilentlyContinue
          if ($skips) {
            $skips | ForEach-Object { Write-Host $_.Line }
            throw "a daemon security test SKIPPED. A SKIP is not a PASS for this gate."
          }
          $passes = (Select-String -Path 'boxdd-tests.log' -Pattern '^\s*--- PASS' -ErrorAction SilentlyContinue).Count
          if ($passes -eq 0) {
            throw "no test reported PASS; this gate executed nothing meaningful."
          }
          Write-Host "PASS: $passes daemon security test(s) executed with no skips."

      - name: upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-daemon-tests
          path: boxdd-tests.log
          if-no-files-found: ignore
