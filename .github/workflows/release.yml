name: Release

# Publishes a GitHub Release for a version tag, attaching the binaries that CI
# already BUILT AND VERIFIED for that commit.
#
# # Why this does not build anything
#
# A release must not ship a binary that no gate has seen. The Linux and macOS
# workflows run the full verification set - focused tests, the production registry
# and topology contracts, capability verification, the runtime smoke, and the Clash
# API probe - against the artifact they upload. This workflow therefore DOWNLOADS
# those artifacts rather than recompiling: the bytes attached to the release are the
# bytes that passed.
#
# It also means the release cannot drift from what CI measured. A rebuild here could
# differ (a dependency resolution, a toolchain patch) and nothing would have checked
# the difference.
#
# # Selection, waiting and integrity
#
# All of it lives in scripts/ci/release-artifacts.sh, which is the part that can be
# tested without a 90-minute workflow run, and is - by
# scripts/ci/test-release-artifacts.sh, against a mock `gh`, including the negative
# cases. This file is only the wiring.
#
# What the previous inline version got wrong, and why it is now a script:
#
#   * it asked `gh run list --limit 60` for the runs on a commit. That is a window
#     over the whole repository, so unrelated activity could push the target runs
#     out of it, and it matched them by display NAME, which a rename breaks
#     silently. Runs are now queried through the API by workflow id and commit SHA.
#   * it required the answer to be exactly two rows in status
#     "completed,completed", then exactly "success,success". Re-running a workflow
#     for the same commit - routine here, 13 of the last 100 commits on each
#     product workflow carry two or three runs - made that condition unsatisfiable,
#     so a green pair could not be released.
#   * a commit whose CI had never run took the same path as a slow one, so the job
#     waited out its full deadline before saying so. Run 37811184607 (tag
#     v1.15.0-alpha.7) printed "runs: 0" every 30 seconds from 16:44:51Z to
#     18:14:55Z and then failed. That case now fails in seconds with the dispatch
#     commands to run.
#   * it wrapped `gh run download` in an escape that swallowed download failures,
#     and verified whichever `.sha256` files it happened to find, so one platform's
#     hash could stand in for another's. Each platform is now required to have its
#     own binary, checksum and BUILD-INFO, all three are verified, and the recorded
#     commit must be the commit being released.

# Tag creation does not publish automatically.
# Release is explicitly dispatched by the maintainer.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.1)'
        required: true
      dry_run:
        description: 'Validate only: resolve, wait for CI, download and verify artifacts, but do NOT publish'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

# One tag is released by one run, and a second dispatch for the same tag waits rather than
# racing it.
#
# Without this, two dispatches for one tag run CONCURRENTLY, both holding `contents: write`,
# both able to publish - and the second one's `check-upload` would be comparing its staged set
# against a release the first had just created. `cancel-in-progress` is deliberately false: the
# whole point is that a release is never cancelled, because a cancelled release can leave a tag
# with a partial asset set, and the read-back step that would have caught it never runs.
#
# Keyed on the TAG rather than the ref, because the tag input is what identifies the release;
# dispatching twice from two different branches for the same tag is the case this exists for.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Bounded, and above the longest wait any step can perform.
    #
    # The job previously had NO timeout, while the product plan waits up to 5400s (90 minutes)
    # and the desktop step waits up to another 5400s. A release that hung would therefore hold a
    # `contents: write` runner indefinitely. 180 minutes covers 90 + 90 with margin for the
    # download, verify, flatten and publish steps; it is not a target, it is a ceiling.
    timeout-minutes: 180
    env:
      RELEASE_EXTRA_PLATFORMS: true
    steps:
      # The gate's own tests first. They need no network and take seconds, and they
      # are the only way a defect in the selection logic can be caught before the
      # logic is trusted with a published binary.
      # ORDER MATTERS, and getting it wrong is how this workflow first failed on a real
      # runner with "./tooling/scripts/ci/release-artifacts.sh: No such file or directory" (exit 127).
      #
      # `check-tag` proves that HEAD IS the tagged commit, so the tag has to be checked out
      # at the workspace root. But a release tag points at a commit that may predate the
      # tooling itself - the first tag tried here does - so checking the tag out at the root
      # deletes the very script the next step runs.
      #
      # So the tag lands at the root and the tooling lands in `tooling/`, from the default
      # branch, where the tag's checkout cannot remove it. The script is invoked through
      # that path but still RUNS FROM the root, which is what makes its `git rev-parse HEAD`
      # resolve to the tagged commit rather than to the tooling checkout.
      - name: check out the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      # PINNED TO THE TAG, so the tooling revision is part of the release rather than whatever the
      # dispatched branch happened to point at.
      #
      # Without `ref`, `actions/checkout` uses the ref the workflow was DISPATCHED ON - normally
      # `testing` - which produced a release whose artifacts came from the tag and whose checker came
      # from the branch tip. Three consequences, and this closes all three:
      #
      #   1. future tooling judged a past tag. A contract change landed after the tag was cut applied
      #      to artifacts built under the old rules, so a release could fail for a reason that did not
      #      exist when it was built.
      #   2. a tooling bug on `testing` blocked every release, including one whose artifacts were
      #      fine. Not hypothetical: a cleanup step that silently matched nothing blocked a dry run of
      #      an otherwise complete tag.
      #   3. the release could not say which tooling revision judged it, because nothing recorded one.
      #      The identity step below does now.
      #
      # Pinning to the TAG rather than to a literal SHA is deliberate. A hardcoded SHA would rot: the
      # tooling must be at least as new as the tag for every release, and a tag cut later would carry
      # a tooling SHA this file had never heard of. Binding both to `inputs.tag` keeps
      # PRODUCT_SHA == TOOLING_SHA by construction, and it makes "the tag must contain the tooling
      # that releases it" a rule the release can actually check - which the identity step does.
      - name: check out the release tooling at the tagged revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          path: tooling

      # Records which revision is judging this release, and asserts it IS the release.
      #
      # This is the half of the trust boundary a pin alone cannot provide. Pinning the tooling to the
      # tag makes PRODUCT_SHA == TOOLING_SHA by construction; this step proves it at run time, so a
      # future edit that reintroduces a floating checkout fails here instead of silently reverting to
      # "the branch tip judged the tag".
      #
      # It runs BEFORE the gate self-test, so that a mismatch is reported as a mismatch rather than as
      # whatever confusing failure the wrong tooling produces downstream.
      - name: bind the tooling identity to the released commit
        env:
          # The tag is DATA, passed in as an environment variable - never interpolated into the shell
          # source. This is the contract the release gate self-test enforces, and it is not a style
          # preference: `${{ }}` is substituted into the `run:` body before the shell ever sees it, so
          # an input carrying `"; rm -rf /"` or a backtick would become shell syntax rather than a
          # value. This step's first version interpolated it in three places and failed 1 of the 92
          # gate cases; the pin itself was fine and is unchanged.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          product_sha="$(git rev-parse HEAD)"
          tooling_sha="$(git -C tooling rev-parse HEAD)"
          {
            echo "PRODUCT_SHA=$product_sha"
            echo "TOOLING_SHA=$tooling_sha"
            echo "RELEASE_TAG=$INPUT_TAG"
          } >> "$GITHUB_ENV"
          echo "product commit : $product_sha  (tag $INPUT_TAG)"
          echo "tooling commit : $tooling_sha"
          if [ "$product_sha" != "$tooling_sha" ]; then
            echo "FAIL: the release tooling is not the released commit." >&2
            echo "      product = $product_sha" >&2
            echo "      tooling = $tooling_sha" >&2
            echo "      A release must be judged by the tooling the tag carries. If this fires, the" >&2
            echo "      tooling checkout has lost or changed its 'ref', which reintroduces the exact" >&2
            echo "      trust boundary this step exists to hold." >&2
            exit 1
          fi
          {
            echo "### Release identity"
            echo ""
            echo "| | commit |"
            echo "|---|---|"
            echo "| product (\`$INPUT_TAG\`) | \`$product_sha\` |"
            echo "| release tooling | \`$tooling_sha\` |"
            echo ""
            echo "The judging tooling is the released commit itself."
          } >> "$GITHUB_STEP_SUMMARY"

      # Formal Release does not re-prove the release tooling. It proves that the tooling WAS
      # proved, at exactly this commit, by the workflow that owns that proof.
      #
      # This step used to run the 92-case suite here, on the publishing runner. That made the
      # same suite execute three times per release - once on every push (verify.yml), once on
      # the release-tooling push (release-contract-verify.yml) and once more here - and it meant
      # the publishing run was re-deriving a fact that had already been established, on a runner
      # holding `contents: write`, minutes before it published. A release pipeline is a promotion
      # pipeline: it consumes evidence, it does not regenerate it.
      #
      # `evidence` resolves the REQUIRED EVIDENCE gates (verify.yml and
      # release-contract-verify.yml) by exact head_sha, requires the NEWEST run at that SHA to be
      # completed and successful - never falling back to an older green - and then requires every
      # JOB of those runs to have succeeded, because a run can conclude `success` with a skipped
      # job and a skipped job proves nothing.
      #
      # The timeout is deliberately SHORT, and it is not the 5400s the product plan uses. A
      # product workflow may legitimately still be building when the release starts. Evidence
      # gates must already be complete: if Verify or RCV is still running for a commit whose
      # installer, tarballs and records have all finished, the release is early, not the gate.
      # Failing in ten minutes with an instruction is better than occupying a publishing runner
      # for ninety. It stays bounded rather than immediate so a just-finished gate is not missed
      # to API latency.
      - name: require exact-SHA source and tooling evidence
        # `gh` is not authenticated in a workflow unless GH_TOKEN is set, and `evidence` resolves each
        # required workflow through the API before it can ask for that workflow's runs. Without this
        # the step dies at the FIRST workflow with
        #
        #     gh: To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN environment variable.
        #     FAIL: cannot resolve workflow '.github/workflows/verify.yml' in 'Piggy-Cat-bit-shadow/sing-box'.
        #
        # which reads as a missing workflow rather than a missing token - the two failures are one
        # message apart and the message names the wrong one. The job already declares
        # `actions: read`, so only the token was absent.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p verify-logs
          sha="$(git -C . rev-parse HEAD)"
          echo "candidate commit: $sha"
          ./tooling/scripts/ci/release-artifacts.sh evidence \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$sha" \
            --out verify-logs/evidence.tsv \
            --interval 20 \
            --timeout 600
          echo
          echo "required evidence, newest exact-SHA run each, every job successful:"
          while IFS=$'\t' read -r wf wfid rid rnum status conclusion rsha url; do
            [ -n "$wf" ] || continue
            printf '  %-46s run %-12s #%-4s %s  %s\n' "$wf" "$rid" "$rnum" "$conclusion" "$url"
          done < verify-logs/evidence.tsv

      - name: upload the evidence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-record
          path: verify-logs/
          if-no-files-found: warn
          retention-days: 14

      # The tag is validated before it is used for anything. It arrives as an
      # environment variable and never as an interpolation into a shell body:
      # `${{ inputs.tag }}` inside `run:` would be a script-injection sink.

      - name: resolve and validate the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ./tooling/scripts/ci/release-artifacts.sh check-tag --tag "$INPUT_TAG"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"

      # The release version has ONE authority: release/JIEJIE_VERSION in the commit being
      # released. It is read here, from the tag's own checkout, and every later step takes
      # it from this output - the installer name, the overlay and the desktop dispatch all
      # derive from it rather than carrying their own copy.
      #
      # The tag and the file are cross-checked, so a tag whose checkout declares another
      # version stops the release here instead of naming artifacts for one version and
      # building another.
      - name: resolve the release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="$(./tooling/scripts/ci/release-artifacts.sh release-version --tag "$INPUT_TAG")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "release version: $version (release/JIEJIE_VERSION at $INPUT_TAG)"

      # Computed, never inferred inline. Anything that is not exactly `true` or
      # `false` fails here, so a malformed or missing input cannot reach the
      # publish step and be read as "not a dry run".
      - name: decide whether this run may publish
        id: plan
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          publish="$(./tooling/scripts/ci/release-artifacts.sh publish-flag --dry-run "$INPUT_DRY_RUN")"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = "true" ]; then
            echo "this run WILL publish a release"
          else
            echo "dry run: everything is verified, nothing will be published"
          fi

      # Selects one successful run per product workflow for this exact commit and
      # writes them to a plan. A run that is still executing is waited for, within
      # a bound; a missing, failed, cancelled or skipped one fails here, with the
      # run URLs.
      - name: select the CI runs for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "commit: $sha"
          # Published to later steps through the environment so the publish step
          # names the same commit this step verified.
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          ./tooling/scripts/ci/release-artifacts.sh plan \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$sha" \
            --out release-plan/runs.tsv \
            --interval 30 \
            --timeout 5400

      # Downloads from the runs the step above selected - not from a fresh query,
      # so the runs that were judged are the runs that are unpacked.
      #
      # # Why there is no Android cleanup step any more
      #
      # There used to be one, and it was sixty lines of hard-won correctness: the Android artifact
      # carried `libbox.provenance` and `SHA256SUMS.txt` alongside the four public files, so the
      # release downloaded six and deleted two. Two earlier versions of that cleanup were wrong in
      # instructive ways - a root-relative `rm -f` that matched nothing and still exited 0, then a
      # global `find -name SHA256SUMS.txt` that would have deleted another product's file and turned
      # a fail-closed allowlist refusal into a silent pass - and the final version was carefully
      # scoped and asserted its own postcondition.
      #
      # All of that is gone because the PRODUCER no longer hands over what it does not ship. The
      # Android workflow uploads the four public files as `android-core-arm64-<sha>` and the records
      # as `android-core-arm64-records-<sha>`, and this step downloads both BY EXACT NAME, staging
      # the records into `release-records/` rather than into the payload tree. Evidence is now
      # unable to reach the allowlist instead of being deleted before it gets there, which is a
      # structural property rather than a check that has to keep being right.
      #
      # Consumer does not clean up after producer; producer does not hand over what it does not
      # ship. The allowlist in `release-artifacts.sh verify` is unchanged and still deliberately
      # narrow: widening it was never the fix.
      - name: download the verified artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./tooling/scripts/ci/release-artifacts.sh download \
            --repo "$GITHUB_REPOSITORY" \
            --plan release-plan/runs.tsv \
            --dir release-assets \
            --evidence-dir release-records

          echo
          echo "payload staged (public deliverables only):"
          find release-assets -type f | sort | sed 's/^/  /'
          echo "evidence staged (never published):"
          find release-records -type f | sort | sed 's/^/  /'

      # The desktop installer is a public deliverable too, and it arrives by a different
      # route: that workflow is dispatch-only and produces a signed-test NSIS installer
      # rather than a tarball, so there is no run to select before one exists. This finds
      # the run for this exact commit, waits for it if it is still going, and stages it -
      # including the build record, which the verify step reads to prove the installer's
      # core SHA. The record is not published; check-upload is what keeps it out.
      - name: stage the Windows desktop installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./tooling/scripts/ci/release-artifacts.sh desktop \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$RELEASE_SHA" \
            --out release-desktop \
            --interval 30 \
            --timeout 5400

      # Per platform: the binary, its .sha256, its BUILD-INFO, a real
      # `sha256sum -c`, the platform read out of the file's own header, and the
      # commit recorded by the build. A hash for one platform does not cover the
      # other. The desktop installer is verified from its own build record for the
      # same reason: a filename containing the version is not provenance.
      - name: verify the downloaded artifacts
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The installer and its build record arrive in two different artifacts, and only
          # the installer is a deliverable, so they are staged apart. `--desktop-records`
          # names where the record is; without it the installer's core cannot be proven.
          ./tooling/scripts/ci/release-artifacts.sh verify \
            --dir release-assets \
            --sha "$RELEASE_SHA" \
            --desktop-dir release-desktop \
            --desktop-records release-desktop.records \
            --version "$RELEASE_VERSION"

      - name: flatten the release assets
        env:
          # check-tag already proved this is a validated release tag and the previous step
          # proved the checkout's release/JIEJIE_VERSION matches it; both are passed through
          # the environment rather than interpolated into the script body.
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # `gh run download --name` keeps the artifact's own directory, so the installer is
          # one level below release-desktop. Globbed rather than spelled out: the directory
          # is named after the artifact, whose version literal has been stale before.
          installer=release-desktop/*/"Jiejiebox-v${RELEASE_VERSION}-windows-x64.exe"
          [ -f $installer ] || { echo "FAIL: the staged desktop installer is not at $installer" >&2; exit 1; }
          ./tooling/scripts/ci/release-artifacts.sh flatten \
            --plan release-plan/runs.tsv \
            --dir release-assets \
            --out upload \
            --tag "$RELEASE_TAG" \
            --desktop "$installer" \
            --version "$RELEASE_VERSION"

      # The public contract is checked against the WORKSPACE, not against the command that
      # produced it: this is the last look before publishing, and it answers "is exactly the
      # promised set of files about to go out" rather than "did flatten behave".
      - name: confirm the upload set is exactly the public contract
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./tooling/scripts/ci/release-artifacts.sh check-upload \
            --out upload \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION"

      # The ONLY step a dry run skips. Everything before it - validating the tag,
      # waiting for the CI runs for that commit, downloading the artifacts those
      # runs produced, verifying their SHA256s, and flattening the asset set - is
      # the part that can be wrong, and a dry run exercises all of it. Publishing is
      # the one irreversible act, so it is the one behind the flag, and the flag
      # defaults to false so the real path is unchanged.
      - name: create the release
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          sha="$RELEASE_SHA"
          version="$RELEASE_VERSION"

          # Deliberately NOT --prerelease and NOT --draft: v0.1 is the first stable
          # release of this fork.
          #
          # Every asset is named EXPLICITLY. A glob would publish whatever happened to be
          # in the directory, which is how CI records once reached a release page: the
          # allowlist is checked immediately above, and naming the files here means the
          # upload cannot be wider than the check that passed.
          gh release create "$tag" \
            --title "$tag" \
            --target "$sha" \
            --notes "" \
            "upload/Jiejiebox-v${version}-windows-x64.exe" \
            "upload/jiejie-sing-box-linux-amd64-${tag}.tar.gz" \
            "upload/jiejie-sing-box-macos-arm64-${tag}.tar.gz" \
            "upload/jiejie-sing-box-windows-amd64-${tag}.tar.gz" \
            "upload/jiejie-sing-box-android-arm64-${tag}.tar.gz" \
            upload/SHA256SUMS

          echo "PASS: release $tag created"

          # Read the release back and confirm the published set is the contract. The
          # local check proved what was uploaded; this proves what the download page
          # actually carries, which is the thing a user sees.
          published="$(gh release view "$tag" --json assets \
            --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' \
            "Jiejiebox-v${version}-windows-x64.exe" \
            "jiejie-sing-box-linux-amd64-${tag}.tar.gz" \
            "jiejie-sing-box-macos-arm64-${tag}.tar.gz" \
            "jiejie-sing-box-windows-amd64-${tag}.tar.gz" \
            "jiejie-sing-box-android-arm64-${tag}.tar.gz" \
            SHA256SUMS | sort)"
          if [ "$published" != "$expected" ]; then
            echo "FAIL: the published asset set is not the public contract." >&2
            echo "expected:" >&2
            printf '  %s\n' $expected >&2
            echo "found:" >&2
            printf '  %s\n' $published >&2
            exit 1
          fi
          echo "PASS: the published assets are exactly the public contract"
