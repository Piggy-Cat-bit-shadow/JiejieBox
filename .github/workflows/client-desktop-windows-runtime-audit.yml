name: Windows desktop runtime audit

# Audits the BUILT installer on a real (hosted) Windows machine: daemon service registration, the
# secure service install path under Program Files, the NSIS install/reinstall/uninstall lifecycle,
# and the signature state of the driver packages.
#
# # Why this is a separate workflow
#
# These four checks answer "does it behave on Windows", not "is this the artifact we meant to
# build". UAC, Program Files ACLs, service behaviour across a reinstall, driver loading and reboot
# are not properties a hosted runner represents, so a red result here is evidence about the RUNNER
# at least as often as about the product. Keeping them in the build workflow behind one exit status
# made the two indistinguishable.
#
# An earlier attempt kept them in the build workflow behind `continue-on-error: true`. That was
# rejected as a final design and is gone: it suppressed a failure instead of giving it an honest
# status. Here the gates are ORDINARY STEPS, so a failure turns THIS WORKFLOW red - visible in the
# Actions list and in every status summary - rather than being reported as a green run with a
# warning nobody reads.
#
# # The audit tooling is pinned to the audited build's commit
#
# AUDITED_ARTIFACT_SHA == AUDIT_TOOLING_SHA, always. The scripts that consume the artifacts are
# checked out at `audited_sha` - the commit the installer was built from - never at the branch HEAD.
#
# This is not a formality. Checking the tooling out at `testing` would allow the artifacts from
# commit A to be tested by the scripts of commit B, and the failure mode is silent in the direction
# that matters: a script changed to be MORE tolerant would keep passing artifacts it no longer
# describes. The earlier revision did exactly that and only printed the mismatch. It is now a hard
# assertion before any gate runs - see "Pin the audit to the audited build" - and it FAILS, it does
# not warn.
#
# `tooling_ref` exists only as an explicitly-marked NON-RELEASE DIAGNOSTIC override. Leaving it
# empty - which is what both the automatic and the normal manual path do - means the tooling comes
# from the audited SHA. A run that sets it is marked non-release in its own log and summary.
#
# # Gating status
#
# NOT release-blocking, by product definition. `release-artifacts.sh` requires the Windows desktop
# INSTALLER workflow's run to succeed and never consults this one, so a red audit does not
# invalidate a successfully built installer. It is also not a green light: a green run here is not
# Windows acceptance. TUN, WinDivert interception, the system proxy, reboot, sleep/wake and
# long-running stability are properties of real hardware - see docs/WINDOWS-ACCEPTANCE.md and
# docs/WINDOWS-STATUS.md.
#
# # What it needs from the build workflow
#
# Two artifacts from the same build run:
#
#   * the signed-test INSTALLER      - gate 6 runs it for real, silently
#   * the UNPACKED application tree  - gates 5, 5b and 7 need the packaged daemon and drivers
#
# The second is needed because gate 6 tears its installation down at the end, so "install it and
# audit the installed copy" is not available, and because gates 5/5b/7 are deliberately about the
# SIGNED PACKAGE rather than about an installed state.

on:
  # Run automatically after the installer is built. This is the real topology: the audit consumes
  # the build's artifacts, so it follows it rather than being dispatched beside it.
  workflow_run:
    workflows: ["Windows desktop installer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      core_sha:
        description: 'Core commit the installer was built from (40 hex). Pins BOTH the audited artifacts and the audit tooling.'
        required: true
      core_version:
        description: 'Jiejiebox release version (X.Y.Z). Verified against release/JIEJIE_VERSION at core_sha.'
        required: true
      tooling_ref:
        description: 'NON-RELEASE DIAGNOSTIC ONLY. Leave EMPTY: the audit tooling is then checked out at core_sha. Set it only to test new scripts against an older artifact, and read the resulting report as a diagnostic, never as an acceptance result.'
        required: false
        default: ''
      gates:
        description: 'NON-RELEASE DIAGNOSTIC ONLY. "all" (default) runs every gate and is the only value an acceptance run may use. "gate6" runs gate 6 ALONE on a fresh runner, which is how "does the installer hang by itself, or only after gates 5/5b?" gets MEASURED instead of inferred.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - gate6
      release_kind:
        description: 'release (default) audits a tagged candidate. audit is the DIAGNOSTIC path: the build run it consumes was produced with release_kind=audit, so this record must never be cited as a release acceptance result.'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - audit

permissions:
  contents: read
  # actions:read is required to look the build run up and download its artifacts. This workflow
  # never writes anything to the repository and never touches a release.
  actions: read

env:
  RECORDS_DIR: build/records
  SERVICE_WORK_DIR: C:\ProgramData\jiejiebox-daemon-ci-smoke
  PROBE_DIR: C:\Program Files\sing-box-ci-probe

jobs:
  runtime-audit:
    name: service / secure-install / lifecycle / drivers
    # windows-latest rather than a pinned image label, matching the build workflow: this pipeline
    # needs the Electron, Node, Rust and signing toolchains that image ships.
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # The audited commit is normalised FIRST, because everything downstream is pinned to it: the
      # tooling checkout, the version file, and the run that is looked up.
      - name: Normalise the audited build SHA
        id: audited
        shell: pwsh
        env:
          # workflow_run carries the commit only as the triggering run's head_sha, and
          # workflow_dispatch carries it as an input; both are normalised here so the rest of the
          # job reads one value.
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.core_sha }}
          INPUT_TOOLING_REF: ${{ inputs.tooling_ref }}
        run: |
          $ErrorActionPreference = "Stop"
          $auditedSha = if ($env:INPUT_SHA) { $env:INPUT_SHA.Trim() } else { $env:EVENT_SHA }

          if ($auditedSha -notmatch '^[0-9a-f]{40}$') {
            throw "the audited build SHA must be 40 lowercase hex characters, got '$auditedSha'"
          }

          # Empty means "pinned to the audited SHA", which is the only release-valid setting.
          # Anything else is the diagnostic override, and it is announced loudly rather than
          # quietly changing what this run proves.
          $toolingRef = if ($env:INPUT_TOOLING_REF) { $env:INPUT_TOOLING_REF.Trim() } else { $auditedSha }
          $nonRelease = $toolingRef -ne $auditedSha

          if ($nonRelease) {
            Write-Host "::warning::NON-RELEASE DIAGNOSTIC: tooling_ref '$toolingRef' is NOT the audited build SHA '$auditedSha'."
            Write-Host "::warning::This run tests artifacts from one commit with scripts from another. Its result is NOT an acceptance result and must not be cited as one."
          }

          Write-Host "audited build SHA : $auditedSha"
          Write-Host "tooling ref       : $toolingRef$(if ($nonRelease) { '   <-- NON-RELEASE DIAGNOSTIC' } else { '   (pinned to the audited build)' })"
          "audited_sha=$auditedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tooling_ref=$toolingRef" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "non_release=$($nonRelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Pinned to the audited commit. `tooling_ref` is that same SHA unless the diagnostic override
      # was set, so the default path cannot test one commit's artifacts with another's scripts.
      - name: Check out the runtime audit tooling at the audited build SHA
        uses: actions/checkout@v4
        with:
          path: tooling
          ref: ${{ steps.audited.outputs.tooling_ref }}
          fetch-depth: 1

      # The version names the installer INSIDE the artifact, so it has to be known before anything
      # is downloaded - and it must come from the audited commit, not from a branch HEAD, or the
      # audit could be told to expect a version the artifact does not carry. Reading the file out of
      # the pinned checkout means version metadata and artifact provenance have one source.
      #
      # An explicitly dispatched `core_version` is still honoured, but it is VERIFIED against that
      # file rather than trusted: a disagreement means the caller and the commit disagree about what
      # was built, and that fails closed instead of picking one.
      - name: Resolve the version from the audited SHA
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.core_version }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "tooling commit : $(git -C tooling rev-parse HEAD)"
          Write-Host "audited build  : ${{ steps.audited.outputs.audited_sha }}"

          $versionFile = Join-Path $PWD "tooling/release/JIEJIE_VERSION"
          if (-not (Test-Path -LiteralPath $versionFile)) {
            throw "release/JIEJIE_VERSION is not present at the audited SHA ${{ steps.audited.outputs.audited_sha }}"
          }
          $fileVersion = (Get-Content -LiteralPath $versionFile -Raw).Trim()
          if ($fileVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "release/JIEJIE_VERSION at the audited SHA is not an X.Y.Z version (got '$fileVersion')"
          }

          if ($env:INPUT_VERSION) {
            $inputVersion = $env:INPUT_VERSION.Trim()
            if ($inputVersion -ne $fileVersion) {
              throw "core_version '$inputVersion' disagrees with release/JIEJIE_VERSION '$fileVersion' at the audited SHA ${{ steps.audited.outputs.audited_sha }}. One of them does not describe the artifact, so this fails closed rather than choosing."
            }
            Write-Host "core_version '$inputVersion' matches release/JIEJIE_VERSION at the audited SHA"
          }

          $version = $fileVersion
          Write-Host "audited version: $version"
          "core_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Resolve the build run to audit
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDITED_SHA: ${{ steps.audited.outputs.audited_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $sha = $env:AUDITED_SHA

          # The newest successful run of the INSTALLER workflow for this commit. Selected by
          # workflow path, so a renamed or added workflow cannot be mistaken for it, and requiring
          # `success` because auditing a failed build would report on an artifact that does not
          # exist.
          $runs = gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&per_page=100" `
            --jq '.workflow_runs[] | select(.path == ".github/workflows/client-desktop-windows.yml") | [.id, .run_number, .status, .conclusion, .head_sha] | @tsv'
          if (-not $runs) {
            throw "no run of client-desktop-windows.yml exists for $sha, so there is nothing to audit"
          }
          $chosen = $null
          foreach ($line in ($runs -split "`n")) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split "`t"
            if ($parts[3] -eq "success") { $chosen = $parts; break }
          }
          if ($null -eq $chosen) {
            throw "no SUCCESSFUL run of client-desktop-windows.yml exists for $sha; refusing to audit a failed build"
          }

          # The run was selected BY head_sha, but the API's own view of that field is asserted
          # rather than assumed: a run that does not carry the audited SHA is not the audited build.
          if ($chosen[4] -ne $sha) {
            throw "selected run $($chosen[0]) is for $($chosen[4]), not the audited SHA $sha"
          }

          Write-Host "auditing build run #$($chosen[1]) (id $($chosen[0])) for $sha"
          "run_id=$($chosen[0])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "run_number=$($chosen[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # The pin, asserted before any gate runs. This is the whole point of the workflow: artifacts
      # from commit A must be tested by scripts from commit A. A mismatch FAILS the run - it is not
      # a warning and it is not something a later green gate can compensate for.
      - name: Pin the audit to the audited build
        shell: pwsh
        env:
          AUDITED_SHA: ${{ steps.audited.outputs.audited_sha }}
          EXPECTED_TOOLING: ${{ steps.audited.outputs.tooling_ref }}
          NON_RELEASE: ${{ steps.audited.outputs.non_release }}
        run: |
          $ErrorActionPreference = "Stop"
          $auditedSha = $env:AUDITED_SHA
          $toolingSha = (git -C tooling rev-parse HEAD).Trim()
          $installerArtifact = "jiejiebox-windows-signed-test"
          $unpackedArtifact = "jiejiebox-windows-unpacked-audit-input"

          $lines = @(
            "AUDITED_BUILD_RUN_ID     = ${{ steps.build.outputs.run_id }}",
            "AUDITED_BUILD_RUN_NUMBER = ${{ steps.build.outputs.run_number }}",
            "AUDITED_BUILD_SHA        = $auditedSha",
            "AUDIT_TOOLING_SHA        = $toolingSha",
            "AUDITED_VERSION          = ${{ steps.version.outputs.core_version }}",
            "INSTALLER_ARTIFACT_NAME  = $installerArtifact",
            "UNPACKED_ARTIFACT_NAME   = $unpackedArtifact",
            "RELEASE_KIND             = ${{ inputs.release_kind }}",
            "NON_RELEASE_DIAGNOSTIC   = $env:NON_RELEASE"
          )
          # A release-kind audit is non-release by definition, alongside the tooling_ref override.
          # Stated in the record rather than left to the reader, for the same reason the override is:
          # a green result that nobody can tell apart from an acceptance result is worse than a red
          # one, because it gets cited.
          if ('${{ inputs.release_kind }}' -eq 'audit') {
            Write-Host "::warning::NON-RELEASE DIAGNOSTIC: this is a release_kind=audit run. The installer under test was built from an untagged commit, so this result must not be cited as a release acceptance result."
            $lines += "RELEASE_ELIGIBLE         = NO (release_kind=audit: the audited commit is untagged)"
          }
          foreach ($line in $lines) { Write-Host $line }
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          # The checkout was requested at this ref, so anything else means the ref did not resolve
          # to the commit we asked for - a silent failure mode that would otherwise be invisible.
          if ($toolingSha -ne $env:EXPECTED_TOOLING) {
            throw "the tooling checkout is at $toolingSha but was requested at $($env:EXPECTED_TOOLING)"
          }

          if ($auditedSha -ne $toolingSha) {
            throw "AUDITED_BUILD_SHA ($auditedSha) != AUDIT_TOOLING_SHA ($toolingSha). Refusing to test one commit's artifacts with another commit's scripts."
          }
          Write-Host "ASSERTION PASSED: AUDITED_BUILD_SHA == AUDIT_TOOLING_SHA ($auditedSha)"

      # The `id` is load-bearing. This step writes installer_path and unpacked_dir for the gates, and
      # without an id those outputs belong to no step context, so `steps.<id>.outputs.unpacked_dir`
      # resolved to the EMPTY STRING. Gate 5 then built the path
      # "$env:UNPACKED_DIR/resources/daemon/sing-box-daemon.exe", which collapses to
      # "/resources/daemon/sing-box-daemon.exe", and failed with "the daemon does not exist" - a
      # plumbing failure that reads exactly like a product failure in the record. The first flight
      # found this; the unpacked tree itself had downloaded correctly.
      - name: Download the installer and the unpacked application
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $runId = "${{ steps.build.outputs.run_id }}"
          New-Item -ItemType Directory -Path "audit-input" -Force | Out-Null

          # Selected by SHAPE, exactly as release-artifacts.sh does, because the artifact name
          # carries a version that has been stale before. The installer is the one ending in
          # `-signed-test`; the unpacked tree is the one whose name contains `unpacked`.
          $listing = gh api "repos/${{ github.repository }}/actions/runs/$runId/artifacts?per_page=100" `
            --jq '.artifacts[] | select(.expired | not) | [.name] | @tsv'
          if (-not $listing) { throw "run $runId has no unexpired artifacts" }

          $installerArtifact = $null
          $unpackedArtifact = $null
          foreach ($name in ($listing -split "`n")) {
            $name = $name.Trim()
            if ([string]::IsNullOrWhiteSpace($name)) { continue }
            if ($name -like "*-signed-test") { $installerArtifact = $name }
            elseif ($name -like "*unpacked*") { $unpackedArtifact = $name }
          }
          if (-not $installerArtifact) { throw "run $runId has no *-signed-test artifact; found: $listing" }
          if (-not $unpackedArtifact) {
            throw "run $runId has no *unpacked* artifact, which gates 5, 5b and 7 need. A build predating that upload cannot be audited here."
          }

          Write-Host "installer artifact: $installerArtifact"
          Write-Host "unpacked  artifact: $unpackedArtifact"

          gh run download $runId --repo "${{ github.repository }}" --name $installerArtifact --dir "audit-input/installer"
          if ($LASTEXITCODE -ne 0) { throw "gh run download failed for '$installerArtifact'" }
          gh run download $runId --repo "${{ github.repository }}" --name $unpackedArtifact --dir "audit-input/unpacked"
          if ($LASTEXITCODE -ne 0) { throw "gh run download failed for '$unpackedArtifact'" }

          $installer = Get-ChildItem "audit-input/installer" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -like "Jiejiebox-v*-windows-x64.exe" } | Select-Object -First 1
          if ($null -eq $installer) {
            throw "no Jiejiebox-v*-windows-x64.exe under audit-input/installer; found: $((Get-ChildItem 'audit-input/installer' -Recurse | ForEach-Object { $_.FullName }) -join ', ')"
          }
          # The unpacked tree keeps its own directory structure from the upload, so the directory
          # holding sing-box.exe is found rather than assumed.
          $unpacked = (Get-ChildItem "audit-input/unpacked" -Recurse -Filter "sing-box.exe" |
            Where-Object { Test-Path (Join-Path $_.DirectoryName "resources\daemon\sing-box-daemon.exe") } |
            Select-Object -First 1)
          if ($null -eq $unpacked) {
            throw "no unpacked application tree (sing-box.exe beside resources\daemon\sing-box-daemon.exe) under audit-input/unpacked"
          }

          Write-Host "installer : $($installer.FullName)  $($installer.Length) bytes"
          Write-Host "unpacked  : $($unpacked.DirectoryName)"
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "unpacked_dir=$($unpacked.DirectoryName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          New-Item -ItemType Directory -Path $env:RECORDS_DIR -Force | Out-Null

      # --- the four gates ---------------------------------------------------
      #
      # Ordinary steps. No continue-on-error, no `|| true`, no `if: always()` on the gate itself:
      # a failure here fails this job and this workflow.

      - name: "[gate 5] daemon service smoke test"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.gates == 'all' }}
        shell: pwsh
        env:
          UNPACKED_DIR: ${{ steps.download.outputs.unpacked_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          # Gate 6 alone is a DIAGNOSTIC run: gates 5 and 5b install and remove a service before gate 6
          # runs, so skipping them is what separates "the installer hangs by itself" from "the installer
          # hangs because of what an earlier gate left behind". A `gates: gate6` run is never an
          # acceptance result - the acceptance run is `gates: all`.
          if ('${{ inputs.gates }}' -eq 'gate6') {
            Write-Host "DIAGNOSTIC RUN: gates 5 and 5b are SKIPPED. Not an acceptance result."
          }
          ./tooling/scripts/ci/windows/Test-DaemonService.ps1 `
            -DaemonPath "$env:UNPACKED_DIR/resources/daemon/sing-box-daemon.exe" `
            -WorkingDirectory $env:SERVICE_WORK_DIR `
            -RecordPath "$env:RECORDS_DIR/daemon-service-smoke-test.txt"

      - name: "[gate 5b] daemon secure service install (the installer's own path)"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.gates == 'all' }}
        shell: pwsh
        env:
          UNPACKED_DIR: ${{ steps.download.outputs.unpacked_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          # The installer runs `service install` with NO relaxed-permission flag under
          # C:\Program Files, and aborts and rolls back when it fails. Gate 5 uses the CI
          # escape hatch; this gate does not, so it is the one that proves the path a real
          # installation takes - and it prints the daemon's stderr, which the installer
          # swallows.
          ./tooling/scripts/ci/windows/Test-SecureServiceInstall.ps1 `
            -PackagedDirectory "$env:UNPACKED_DIR" `
            -ProbeDirectory "$env:PROBE_DIR" `
            -WorkingDirectory "C:\ProgramData\jiejiebox-daemon" `
            -RecordPath "$env:RECORDS_DIR/secure-service-install.txt"

      - name: "[gate 6] NSIS install / reinstall / uninstall lifecycle"
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.download.outputs.installer_path }}
          CORE_VERSION: ${{ steps.version.outputs.core_version }}
        run: |
          $ErrorActionPreference = "Stop"
          # The diagnostic path is under RUNNER_TEMP and deliberately has no spaces: the
          # installer parses it as a command-line option, and it must be outside $PLUGINSDIR
          # and $INSTDIR so it survives customInstall's rollback.
          ./tooling/scripts/ci/windows/Test-InstallerLifecycle.ps1 `
            -InstallerPath "$env:INSTALLER_PATH" `
            -ExpectedVersion "$env:CORE_VERSION" `
            -RecordPath "$env:RECORDS_DIR/installer-lifecycle-smoke-test.txt" `
            -DiagnosticPath "$env:RUNNER_TEMP\jiejiebox-installer-diagnostic.txt"

      - name: "[gate 7] driver package signature audit"
        shell: pwsh
        env:
          UNPACKED_DIR: ${{ steps.download.outputs.unpacked_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          ./tooling/scripts/ci/windows/Test-DriverSignatures.ps1 `
            -DriverDirectory "$env:UNPACKED_DIR/resources/daemon" `
            -RecordPath "$env:RECORDS_DIR/driver-signature-audit.txt"

      # --- summary and cleanup ---------------------------------------------

      - name: Summarise the audit
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $summary = @(
            "### Windows desktop runtime audit",
            "",
            "Audited build run: #${{ steps.build.outputs.run_number }} for ${{ steps.audited.outputs.audited_sha }}",
            "Audit tooling SHA: ${{ steps.audited.outputs.tooling_ref }}",
            "Version: ${{ steps.version.outputs.core_version }}",
            "Installer: ``${{ steps.download.outputs.installer_path }}``",
            ""
          )
          if ("${{ steps.audited.outputs.non_release }}" -eq "true") {
            $summary += @(
              "> **NON-RELEASE DIAGNOSTIC.** The audit tooling was taken from a different commit than",
              "> the audited artifacts. This result must not be cited as an acceptance result.",
              ""
            )
          }
          if ("${{ inputs.release_kind }}" -eq "audit") {
            $summary += @(
              "> **NON-RELEASE DIAGNOSTIC (release_kind=audit).** The audited commit is not the commit",
              "> the v${{ steps.version.outputs.core_version }} tag names, so this run measures a fix",
              "> rather than accepting a release. It must not be cited as an acceptance result.",
              ""
            )
          }
          $summary += @(
            "This workflow is NOT release-blocking by product definition. A red result here does not",
            "invalidate a successfully built installer, and a green one is not Windows acceptance.",
            ""
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($record in @(
            "daemon-service-smoke-test.txt",
            "secure-service-install.txt",
            "installer-lifecycle-smoke-test.txt",
            "driver-signature-audit.txt"
          )) {
            $path = Join-Path $env:RECORDS_DIR $record
            if (Test-Path -LiteralPath $path) {
              "#### $record" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              Get-Content -LiteralPath $path | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            } else {
              "#### $record" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
              "NOT PRODUCED - the gate that writes it did not reach its end." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }

      - name: Upload the audit records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-windows-runtime-audit-records
          path: ${{ env.RECORDS_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: "cleanup: uninstall anything the gates left behind"
        if: always()
        shell: pwsh
        run: |
          # A failed gate can leave a service or an installation behind, and a leftover service is
          # exactly what would make the NEXT run's clean-state precondition fail. Identity comes
          # from the shared resolver, not from a display name: the installation directory and
          # executable are "sing-box" while the product name is "Jiejiebox", so matching on the name
          # would be both wrong and unsafe.
          $ErrorActionPreference = "Continue"
          . (Join-Path $PWD "tooling/scripts/ci/windows/GateHelpers.ps1")
          $service = Get-Service -Name "jiejiebox-daemon" -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            Write-Host "removing a leftover jiejiebox-daemon service"
            $deleted = Invoke-NativeCommand { sc.exe delete "jiejiebox-daemon" }
            Write-Host "  sc.exe delete exited $($deleted.ExitCode)"
          }
          $state = Get-InstallationState
          if ($null -ne $state) {
            Write-Host "leftover installation: root=$($state.Root) layoutVersion=$($state.LayoutVersion)"
            $matches = @($state.UninstallMatches)
            if ($matches.Count -eq 1) {
              $uninstaller = Get-CommandExecutablePath ([string]$matches[0].Entry.UninstallString)
              if (Test-Path -LiteralPath $uninstaller) {
                Write-Host "running the discovered uninstaller $uninstaller"
                $process = Start-Process -FilePath $uninstaller -ArgumentList "/S", "/allusers" -PassThru
                $null = $process | Wait-Process -Timeout 600 -ErrorAction SilentlyContinue
              } else {
                Write-Host "::warning::the matched uninstall entry's uninstaller does not exist: $uninstaller"
              }
            } elseif ($matches.Count -gt 1) {
              Write-Host "::warning::$($matches.Count) uninstall entries match $($state.Root); removing none of them"
              foreach ($line in (Format-UninstallEntries -Entries $matches)) { Write-Host $line }
            } else {
              Write-Host "no uninstall entry matched $($state.Root); deleting only the service"
              $deleted = Invoke-NativeCommand { sc.exe delete "jiejiebox-daemon" }
              Write-Host "  sc.exe delete exited $($deleted.ExitCode)"
            }
          } else {
            Write-Host "no leftover installation was identifiable"
          }
          foreach ($leftover in @($env:SERVICE_WORK_DIR, $env:PROBE_DIR, "C:\ProgramData\jiejiebox-daemon")) {
            if (Test-Path -LiteralPath $leftover) {
              Write-Host "removing leftover $leftover"
              Remove-Item -LiteralPath $leftover -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "leftover cleanup finished"
          # A safety net for FAILED runs, not a gate: the clean end state is asserted by gate 6, and
          # the status of a cleanup pass must not become this job's exit code.
          exit 0

  # A REAL coexistence smoke test, in its own job on its own runner.
  #
  # Separate on purpose, for two reasons. It needs a machine where the OFFICIAL sing-box client is
  # installed and running - the opposite of the clean runner every other gate requires - and it must
  # not disturb gates 5/5b/6/7, which are about this client alone. A second job gives it both, and
  # the two jobs cannot then interfere through the machine either.
  #
  # The regression it exists for: installing OR uninstalling this fork deleted the official client's
  # `sing-box-daemon` service, because the ownership proof could not tell the two clients apart. No
  # other gate can catch that, because no other gate ever constructs "another sing-box client is
  # already here".
  windows-coexistence-smoke:
    name: coexistence smoke (official client beside this one)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Normalise the audited build SHA
        id: audited
        shell: pwsh
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.core_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $auditedSha = if ($env:INPUT_SHA) { $env:INPUT_SHA.Trim() } else { $env:EVENT_SHA }
          if ($auditedSha -notmatch '^[0-9a-f]{40}$') {
            throw "the audited build SHA must be 40 lowercase hex characters, got '$auditedSha'"
          }
          Write-Host "audited build SHA : $auditedSha"
          "audited_sha=$auditedSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check out the gate tooling at the audited build SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.audited.outputs.audited_sha }}
          fetch-depth: 1

      - name: Resolve the version from the audited SHA
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $versionFile = Join-Path $PWD "release/JIEJIE_VERSION"
          if (-not (Test-Path -LiteralPath $versionFile)) {
            throw "release/JIEJIE_VERSION is not present at the audited SHA"
          }
          $version = (Get-Content -LiteralPath $versionFile -Raw).Trim()
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "release/JIEJIE_VERSION is not an X.Y.Z version (got '$version')"
          }
          Write-Host "audited version: $version"
          "core_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Download the built installer
        id: download
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUDITED_SHA: ${{ steps.audited.outputs.audited_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $sha = $env:AUDITED_SHA

          # The newest SUCCESSFUL run of the installer workflow for this commit, selected by
          # workflow path so a renamed or added workflow cannot be mistaken for it.
          $runs = gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&per_page=100" `
            --jq '.workflow_runs[] | select(.path == ".github/workflows/client-desktop-windows.yml") | select(.conclusion == "success") | [.id, .run_number] | @tsv'
          if (-not $runs) {
            throw "no successful run of client-desktop-windows.yml exists for $sha, so there is no installer to test"
          }
          $runId = ($runs -split "`n" | Where-Object { $_.Trim() } | Select-Object -First 1) -split "`t" | Select-Object -First 1
          Write-Host "installer build run: $runId"

          # Selected by SHAPE, as release-artifacts.sh does, because the artifact name carries a
          # version that has been stale before.
          $listing = gh api "repos/${{ github.repository }}/actions/runs/$runId/artifacts?per_page=100" `
            --jq '.artifacts[] | select(.expired | not) | [.name] | @tsv'
          $installerArtifact = $null
          foreach ($name in ($listing -split "`n")) {
            $name = $name.Trim()
            if ($name -like "*-signed-test") { $installerArtifact = $name }
          }
          if (-not $installerArtifact) { throw "run $runId has no *-signed-test artifact; found: $listing" }

          New-Item -ItemType Directory -Path "installer" -Force | Out-Null
          gh run download $runId --repo "${{ github.repository }}" --name $installerArtifact --dir "installer"
          $exe = Get-ChildItem "installer" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "the installer artifact contains no .exe" }
          Write-Host "installer: $($exe.FullName) ($($exe.Length) bytes)"
          "installer_path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: "[coexistence] official client -> install this one -> uninstall it -> official still healthy"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $record = Join-Path $PWD "build/records/coexistence-smoke.txt"
          New-Item -ItemType Directory -Path (Split-Path -Parent $record) -Force | Out-Null

          & "$PWD/scripts/ci/windows/Test-CoexistenceSmoke.ps1" `
            -InstallerPath "${{ steps.download.outputs.installer_path }}" `
            -ExpectedVersion "${{ steps.version.outputs.core_version }}" `
            -RecordPath $record
          $code = $LASTEXITCODE

          if (Test-Path -LiteralPath $record) {
            Get-Content -LiteralPath $record | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

          # 44 is the gate saying it could not set the scenario up (the official installer could not
          # be downloaded or would not install). That is an INFRASTRUCTURE result, not a product
          # regression, and it is reported as a warning with its own exit code so it can never be
          # cited as "coexistence is broken".
          if ($code -eq 44) {
            Write-Host "::warning::coexistence smoke gate: INFRA_DOWNLOAD_FAILURE - the scenario could not be set up. This is NOT a product regression."
            exit 44
          }
          exit $code

      - name: Upload the coexistence record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-windows-coexistence-smoke-records
          path: build/records/coexistence-smoke.txt
          if-no-files-found: warn
          retention-days: 90