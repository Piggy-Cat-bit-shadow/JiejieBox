name: Windows amd64 core

# One custom sing-box core for Windows, for an external loader.
#
# This builds the CORE BINARY ONLY: ./cmd/sing-box for GOOS=windows GOARCH=amd64.
# It deliberately contains no Electron, no pnpm, no Node, no NSIS, no installer, no
# service installation, no daemon and no Authenticode signing. Those belonged to the
# retired desktop experiment, where we were trying to make this fork fit upstream's
# desktop client. We no longer do that: we ship a core and let a third-party loader
# consume it.
#
# The recipe is upstream's own core release recipe, taken from SagerNet/sing-box
# .github/workflows/build.yml (CGO_ENABLED=0, GOOS/GOARCH, -trimpath,
# -ldflags "-X constant.Version=... $(cat release/LDFLAGS) -s -w -buildid=",
# ./cmd/sing-box) and identical to this repository's own Makefile `build` target.
# The one deliberate difference from upstream is the tag set: upstream ships Windows
# without Native Naive, and this fork's whole point is that it has it.
#
# Not adopted from upstream: the legacy Windows 7 toolchain
# (.github/setup_go_for_windows7.sh, which upstream applies to its windows/amd64 and
# windows/386 rows). It is a patched Go build whose purpose is Windows 7 API
# compatibility; this artifact targets Windows 10/11 x64 under an external loader.
# Everything else in upstream's recipe is copied. If Windows 7 support is ever
# wanted, that step is the only thing to add.
#
# Dispatch only, by design. The release workflow does not build Windows: it looks for a
# successful run of this workflow on the release commit and republishes those exact
# verified bytes. See .github/workflows/release.yml.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: >-
          Source ref, tag or commit to build. Leave empty to build the ref this
          workflow runs on. Set it to a tag (for example v0.1.5) to build a release
          from that exact source: the workflow file still comes from the dispatched
          ref, but every compiled byte comes from here.
        required: false
        type: string
      tags_profile:
        description: >-
          fork-windows builds the release artifact (Native Naive included).
          upstream-baseline is a locator probe only: it reproduces upstream's
          Windows tag set, which has no Native Naive, to prove the check below can
          tell the two apart.
        type: choice
        options:
          - fork-windows
          - upstream-baseline
        default: fork-windows

# No concurrency policy, DELIBERATELY, and this comment is the policy.
#
# This workflow is `workflow_dispatch`-only and release-blocking, so a manual candidate must never
# be canceled by anything - including a later dispatch of this same workflow. The way to guarantee
# that is to declare no `concurrency` group at all: with no group there is nothing for a second run
# to join, so no cancellation is possible rather than merely unlikely.
#
# A group is NOT added here for symmetry with the other producers. Adding one would create the very
# cancellation surface this file is avoiding, and `check-release-workflows.py` now asserts that
# every release-blocking manual producer either declares `cancel-in-progress: false` or declares no
# group - so the absence is checked rather than assumed.

permissions:
  contents: read

env:
  # Empty on a non-dispatch event, so the profile default is applied here.
  TAGS_PROFILE: ${{ github.event.inputs.tags_profile || 'fork-windows' }}
  # Upstream's core release toolchain. go.mod declares the minimum language version
  # (go 1.25.5); this is the toolchain upstream actually builds its releases with.
  GO_VERSION: "1.26.8"
  GOOS_TARGET: windows
  GOARCH_TARGET: amd64

jobs:
  core:
    name: sing-box.exe (windows/amd64)
    runs-on: ubuntu-latest
    # ONE full windows/amd64 cross-build - the release artifact - plus packaging and the zip
    # re-expansion. This job used to run three: the release artifact, an unstripped build the
    # symbol check read, and an upstream-baseline negative control. Both extra links are gone;
    # the facts they established are now read from the build constraints and from the artifact's
    # own embedded metadata, with no build step.
    #
    # The ceiling is kept rather than lowered. It was sized for three cross-builds and a hung
    # build or a wedged module download would still burn the 360-minute default without it, so
    # 60 minutes remains a ceiling that only a real hang reaches. Lowering it now would be a
    # guess made against a job whose runtime nobody has measured since this change.
    timeout-minutes: 60
    steps:
      - name: Check out the source to build
        uses: actions/checkout@v5
        with:
          # An explicit source_ref wins; otherwise this is the ref that was dispatched.
          # Everything compiled below comes from this checkout and nothing else.
          ref: ${{ github.event.inputs.source_ref || github.ref }}
          fetch-depth: 0

      # The pinned toolchain is installed BEFORE the step that records it. version.sh
      # reports JJ_GO_VERSION from `go env GOVERSION`, and this step used to run after
      # the provenance step instead of before it, so that value was whichever Go the
      # runner image happened to ship - or `unknown` if it shipped none - while the
      # build below compiled with env.GO_VERSION. build-info.json records it as
      # `go_declared_in_go_mod`, so the shipped record could name a toolchain that built
      # nothing and disagree with its own `go_toolchain` field. Installing first makes
      # the recorded value the toolchain that actually compiles. No artifact byte
      # changes: JJ_GO_VERSION is not in the ldflags.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve the version, the build tags and the provenance
        shell: bash
        run: |
          set -euo pipefail
          # Values written to $GITHUB_ENV reach LATER steps only, so anything this step needs
          # itself is read from the same output right here. Referring to $JJ_VERSION in this
          # step is an unbound variable under `set -u`, which is exactly how the first run
          # failed.
          version_env="$(bash scripts/ci/version.sh)"
          printf '%s\n' "$version_env" >> "$GITHUB_ENV"
          version_now="$(printf '%s\n' "$version_env" | sed -n 's/^JJ_VERSION=//p')"
          [ -n "$version_now" ] || { echo "FAIL: version.sh did not report JJ_VERSION" >&2; exit 1; }

          source_ref="${{ github.event.inputs.source_ref }}"
          [ -n "$source_ref" ] || source_ref="${{ github.ref_name }}"
          source_commit="$(git rev-parse HEAD)"

          # If the ref names a tag we can see, the checkout must be that tag's commit.
          # The published provenance is source_commit, and the release workflow refuses
          # to publish Windows bytes whose source_commit is not the release tag's commit.
          if git rev-parse -q --verify "refs/tags/$source_ref" >/dev/null; then
            tag_commit="$(git rev-parse "$source_ref^{commit}")"
            if [ "$tag_commit" != "$source_commit" ]; then
              echo "FAIL: checked out $source_commit but tag $source_ref is $tag_commit" >&2
              exit 1
            fi
            echo "tag $source_ref resolved to $source_commit"
          fi

          case "$TAGS_PROFILE" in
            fork-windows)      tags_file=release/DEFAULT_BUILD_TAGS_WINDOWS ;;
            upstream-baseline) tags_file=release/DEFAULT_BUILD_TAGS_OTHERS ;;
            *) echo "unknown tags profile: $TAGS_PROFILE" >&2; exit 1 ;;
          esac
          # Read the tag set from the repository being built. Never hand-write a tag list
          # here: whoever maintains release/*_BUILD_TAGS is the single source of truth.
          # v0.1.5 already ships DEFAULT_BUILD_TAGS_WINDOWS, so no fallback is needed.
          tags="$(tr -d '[:space:]' < "$tags_file")"

          {
            echo "SOURCE_REF=$source_ref"
            echo "SOURCE_COMMIT=$source_commit"
            echo "WORKFLOW_COMMIT=${{ github.sha }}"
            echo "BUILD_TAGS=$tags"
            echo "TAGS_FILE=$tags_file"
            echo "ARTIFACT_NAME=sing-box.exe"
            echo "ZIP_NAME=jiejie-sing-box-windows-amd64-v$version_now.zip"
            # The upload name is an IDENTITY: the release contract selects this artifact by exact
            # name, so it carries the COMMIT rather than the version. A version-derived name is
            # not unique across commits - two candidate builds of one version produce artifacts
            # with the same name - and `download` runs before the tag is resolved, so a version
            # it does not know yet could not be resolved there at all.
            echo "UPLOAD_NAME=windows-core-amd64-${{ github.sha }}"
          } >> "$GITHUB_ENV"

          echo "source ref     : $source_ref"
          echo "source commit  : $source_commit"
          echo "workflow commit: ${{ github.sha }}"
          echo "version        : $version_now"
          echo "tags profile   : $TAGS_PROFILE"
          echo "tags file      : $tags_file"
          echo "tags           : $tags"

      - name: Report the resolved inputs
        shell: bash
        run: |
          set -euo pipefail
          echo "building from  : $SOURCE_REF ($SOURCE_COMMIT)"
          echo "workflow commit: $WORKFLOW_COMMIT"
          echo "version        : $JJ_VERSION"
          echo "go (declared)  : $JJ_GO_VERSION"
          echo "go (toolchain) : $(go version)"
          echo "target         : $GOOS_TARGET/$GOARCH_TARGET  CGO_ENABLED=0"

      - name: Build the Windows core
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          export CGO_ENABLED=0 GOOS="$GOOS_TARGET" GOARCH="$GOARCH_TARGET"
          ldflags="-X 'github.com/sagernet/sing-box/constant.Version=$JJ_VERSION' $(cat release/LDFLAGS) -s -w -buildid="

          # The release artifact: exactly the repository's own recipe.
          go build -v -trimpath -o "dist/$ARTIFACT_NAME" -tags "$BUILD_TAGS" \
            -ldflags "$ldflags" ./cmd/sing-box

          # There USED to be two symbol-bearing builds here (dist/sing-box-unstripped.exe and
          # dist/control-baseline.exe), purely so `go tool nm` could count linked symbols. They
          # were two more full windows/amd64 cross-links of the same program, and they are gone.
          #
          # The feature-presence question is answered below against the compiler's own view of the
          # build constraints, which needs no link at all, and the artifact's tag provenance is read
          # out of the shipped binary with `go version -m`. server-linux-amd64.yml made the same
          # change for the same reason ("the `.debug` second build for the symbol audit is GONE").
          #
          # Removing them loses no verification: every fact the nm counts established is still
          # established, and one fact is established more strongly (see the tag-provenance step).

          ls -la dist

      - name: Verify the binary is a windows/amd64 PE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct, sys
          p = "dist/sing-box.exe"
          data = open(p, "rb").read()
          assert data[:2] == b"MZ", "not an MZ executable"
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe:pe+4] == b"PE\0\0", "no PE signature"
          machine = struct.unpack_from("<H", data, pe + 4)[0]
          magic = struct.unpack_from("<H", data, pe + 24)[0]
          names = {0x014c: "i386", 0x8664: "amd64", 0xAA64: "arm64", 0x01c4: "arm"}
          got = names.get(machine, hex(machine))
          print(f"PE machine   : {got} ({hex(machine)})")
          print(f"optional hdr : {hex(magic)} ({'PE32+' if magic == 0x20b else 'PE32'})")
          if got != "amd64":
              sys.exit(f"FAIL: expected amd64, got {got}")
          if magic != 0x20b:
              sys.exit("FAIL: expected PE32+")
          print("PASS: windows amd64 PE32+")
          PY
          echo
          echo "=== go version -m (build metadata embedded in the artifact) ==="
          go version -m "dist/$ARTIFACT_NAME"

      - name: Assert the artifact really carries the build tags it claims
        shell: bash
        run: |
          set -euo pipefail
          # The strongest and cheapest form of this check: `go version -m` reads the Go build
          # metadata EMBEDDED IN THE SHIPPED BINARY and reports the exact `-tags` value it was
          # linked with. Nothing else proves that the bytes on the release page were compiled with
          # the profile this workflow intended. A `go list` proves what the source WOULD compile to;
          # a symbol count proves what one build contained; only this reads the artifact itself.
          #
          # It costs nothing. The command already ran two steps up and its output used to be
          # printed and thrown away.
          #
          # The setting survives -s -w because it lives in the build-info blob rather than the
          # symbol table, which is why this works on the stripped release binary. The same pattern is
          # already used in this repository by scripts/ci/verify-desktop-daemon-provenance.py and
          # scripts/ci/verify-upstream-assumptions.sh.
          reported="$(go version -m "dist/$ARTIFACT_NAME" \
            | sed -n 's/^[[:space:]]*build[[:space:]]\{1,\}-tags=//p' | head -1)"
          if [ -z "$reported" ]; then
            echo "FAIL: dist/$ARTIFACT_NAME carries no -tags build setting, so the artifact cannot" >&2
            echo "      be shown to be the profile this workflow resolved." >&2
            exit 1
          fi

          # Compared as SETS, order-insensitively: the linker records the tags in the order it
          # received them, and nothing guarantees that matches the tag file's order.
          normalise() { printf '%s' "$1" | tr ',' '\n' | sed '/^$/d' | sort | tr '\n' ' '; }
          want="$(normalise "$BUILD_TAGS")"
          got="$(normalise "$reported")"
          echo "expected tags: $want"
          echo "artifact tags: $got"
          if [ "$want" != "$got" ]; then
            echo "FAIL: the artifact was built with different tags than this workflow resolved." >&2
            exit 1
          fi
          # with_naive_outbound is the one tag whose absence would silently ship a core without the
          # feature this fork exists for, so it is named explicitly rather than left to the set
          # comparison above.
          case " $got " in
            *" with_naive_outbound "*) ;;
            *) echo "FAIL: the artifact was not built with with_naive_outbound" >&2; exit 1 ;;
          esac
          echo "PASS: the shipped binary's embedded metadata names exactly the resolved tag set"

      - name: Verify the custom features are compiled in, from the build constraints
        shell: bash
        run: |
          set -euo pipefail
          # Capability presence is checked against the compiler's own view of the build constraints,
          # with NO build step - the method server-linux-amd64.yml already uses, adapted to the one
          # place it does not transfer verbatim.
          #
          # Why `go list -deps` alone is NOT enough here, measured rather than assumed:
          # include/registry.go imports protocol/naive unconditionally and registers its INBOUND, so
          # `protocol/naive` is in the dependency graph under BOTH profiles. Only the tag-gated half
          # discriminates, and that half is a single FILE: protocol/naive/outbound.go carries
          # `//go:build with_naive_outbound`. So the question is asked at file granularity.
          #
          # The control is what makes this non-vacuous, exactly as the deleted baseline build was:
          # the same file must be SELECTED under the release tags and IGNORED under upstream's. If
          # both profiles agreed, the check would prove nothing, and that is a hard failure.
          # Every `go list` below names the TARGET explicitly, and that is load-bearing rather
          # than tidy.
          #
          # `go list` reads GOOS/GOARCH/CGO_ENABLED from its own environment. The build step
          # `export`s them, but a GitHub Actions step is a separate process, so that export does
          # NOT reach this one. A bare `go list` here therefore describes the RUNNER's platform -
          # linux/amd64 on a GitHub-hosted runner - and every assertion below would answer a
          # question about a build this workflow does not ship.
          #
          # That is not hypothetical: it is how "protocol/masque is not in the release build's
          # package graph" was reported for a Windows build, because the host graph resolved the
          # Linux-only QUIC/nftables path instead of the Windows one. The check was right to
          # refuse; it was reading the wrong graph.
          #
          # These are the same values the build step uses, read from the job environment, so the
          # checked graph and the built artifact cannot drift apart.
          export CGO_ENABLED=0 GOOS="$GOOS_TARGET" GOARCH="$GOARCH_TARGET"
          echo "capability check target: $GOOS/$GOARCH CGO_ENABLED=$CGO_ENABLED (host is $(go env GOHOSTOS)/$(go env GOHOSTARCH))"

          gated_file="outbound.go"
          control_tags="$(tr -d '[:space:]' < release/DEFAULT_BUILD_TAGS_OTHERS)"

          selected="$(go list -tags "$BUILD_TAGS" -f '{{range .GoFiles}}{{.}} {{end}}' ./protocol/naive)"
          ignored="$(go list -tags "$control_tags" -f '{{range .IgnoredGoFiles}}{{.}} {{end}}' ./protocol/naive)"

          echo "release profile: protocol/naive compiles -> $selected"
          echo "control profile: protocol/naive ignores  -> $ignored"

          case " $selected " in
            *" $gated_file "*) ;;
            *) echo "FAIL: the release tag set does not compile protocol/naive/$gated_file." >&2
               echo "      A Windows core without the Native Naive outbound is not the core this" >&2
               echo "      fork exists to ship." >&2
               exit 1 ;;
          esac
          case " $ignored " in
            *" $gated_file "*) ;;
            *) echo "FAIL: upstream's tag set ALSO compiles protocol/naive/$gated_file, so this" >&2
               echo "      check cannot discriminate and would prove nothing." >&2
               exit 1 ;;
          esac
          echo "control is sound: upstream's tag set really does exclude the Native Naive outbound"

          # MASQUE is not tag-gated at all - it arrives with the QUIC stack - which is exactly what
          # the deleted control build showed by containing it too. Stated here as a graph fact.
          #
          # The graph queried is the TARGET's, inherited from the export above. Asking the host
          # graph here is what produced a false "protocol/masque is not in the release build's
          # package graph" against a Windows artifact.
          #
          # # Why the graph is written to a file first, and the consumer reads that file
          #
          # The obvious spelling is one pipeline:
          #
          #     go list -deps ... | grep -qx 'github.com/sagernet/sing-box/protocol/masque'
          #
          # and it is a FALSE-NEGATIVE GENERATOR under `set -o pipefail`. `grep -q` exits the moment
          # it matches, closing the read end of the pipe; `go list` is still writing, takes SIGPIPE,
          # and dies with 141. pipefail then reports the pipeline as failed even though grep
          # SUCCEEDED. Measured on this repository: the Windows target graph is 1214 packages and the
          # masque line is the LAST one, so grep always exits while go list still has output queued -
          # the race is not hypothetical, it is the typical case.
          #
          # That is why windows-core passed at 6737404d1 and #34/#35 and then failed at #36/#39 on
          # the same code: it depended on whether go list had already flushed everything.
          #
          # Writing the graph first removes the consumer from the producer's lifetime entirely. The
          # three outcomes are now distinguishable, which is the point:
          #
          #     go list fails          -> that failure is reported as itself
          #     graph ok, no masque    -> genuinely absent from the build
          #     graph ok, masque there -> PASS
          deps_file="$(mktemp)"
          trap 'rm -f "$deps_file"' EXIT
          if ! go list -deps -tags "$BUILD_TAGS" ./cmd/sing-box > "$deps_file"; then
            echo "FAIL: 'go list -deps' itself failed for $GOOS/$GOARCH with tags:" >&2
            echo "      $BUILD_TAGS" >&2
            exit 1
          fi
          echo "package graph: $(wc -l < "$deps_file") packages for $GOOS/$GOARCH"
          if ! grep -Fxq 'github.com/sagernet/sing-box/protocol/masque' "$deps_file"; then
            echo "FAIL: protocol/masque is not in the $GOOS/$GOARCH build's package graph" >&2
            echo "      (queried with GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=$CGO_ENABLED; the" >&2
            echo "      runner host is $(go env GOHOSTOS)/$(go env GOHOSTARCH))" >&2
            echo "      protocol packages actually present:" >&2
            grep 'github.com/sagernet/sing-box/protocol/' "$deps_file" >&2 || true
            exit 1
          fi
          echo "PASS: Native Naive's gated outbound is compiled in, and MASQUE is in the graph"

          {
            echo "NAIVE_OUTBOUND_SELECTED=true"
            echo "MASQUE_IN_GRAPH=true"
          } >> "$GITHUB_ENV"

      - name: Write the checksums and the build record
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256="$(sha256sum "$ARTIFACT_NAME" | cut -d' ' -f1)"
          size="$(stat -c %s "$ARTIFACT_NAME")"

          cat > build-info.json <<JSON
          {
            "version": "$JJ_VERSION",
            "source_ref": "$SOURCE_REF",
            "source_commit": "$SOURCE_COMMIT",
            "workflow_commit": "$WORKFLOW_COMMIT",
            "branch": "$JJ_BRANCH",
            "goos": "$GOOS_TARGET",
            "goarch": "$GOARCH_TARGET",
            "go_toolchain": "$(go version | awk '{print $3}')",
            "go_declared_in_go_mod": "$JJ_GO_VERSION",
            "cgo_enabled": false,
            "build_tags": "$BUILD_TAGS",
            "tags_file": "$TAGS_FILE",
            "tags_profile": "$TAGS_PROFILE",
            "ldflags": "-X constant.Version=$JJ_VERSION \$(cat release/LDFLAGS) -s -w -buildid= -trimpath",
            "trimpath": true,
            "unsigned": true,
            "authenticode_signed": false,
            "purpose": "external-loader-core",
            "native_naive": true,
            "masque": true,
            "naive_outbound_file_selected": $NAIVE_OUTBOUND_SELECTED,
            "masque_in_package_graph": $MASQUE_IN_GRAPH,
            "artifact": "$ARTIFACT_NAME",
            "size": $size,
            "sha256": "$sha256"
          }
          JSON
          cat build-info.json
          sha256sum "$ARTIFACT_NAME" build-info.json > SHA256SUMS
          # ABSOLUTE paths for BOTH arguments, because build-info.sh cd's to the repository
          # root before it does anything: it resolves `$out` against the root, and it appends
          # the artifact_bytes/artifact_sha256 block only when `[ -f "$binary" ]` holds from
          # there. Passed relatively - as this line used to - the sidecar landed in the
          # repository root instead of dist, and the binary was not found at all, so the
          # record would have been written WITHOUT the artifact_sha256 line the release gate
          # matches the downloaded binary against.
          #
          # `dist/BUILD-INFO-WINDOWS.txt` is listed in the upload below, so the file being
          # elsewhere did not fail the upload either: `if-no-files-found: error` only fires
          # when NO listed path matches. The release then died at
          # "BUILD-INFO-WINDOWS.txt: found 0 copies under release-assets".
          #
          # `build-info.json` and `SHA256SUMS` are deliberately NOT uploaded. They are the
          # integrity records for the zip and the exe, they are checked in "Verify the zip is
          # exactly the bytes that were built", and the release allowlist refuses them:
          #
          #     FAIL: unexpected file(s) in the release tree: build-info.json
          #
          # The published record is `BUILD-INFO-WINDOWS.txt`, and the published checksum is
          # `sing-box.exe.sha256` - which is why this workflow writes both.
          #
          # server-linux-amd64.yml and client-macos.yml already pass "$OUT/..." for both
          # arguments, which is why this only ever affected this workflow.
          ../scripts/ci/build-info.sh "$(pwd)/BUILD-INFO-WINDOWS.txt" windows amd64 windows "$(pwd)/$ARTIFACT_NAME"
          test -f BUILD-INFO-WINDOWS.txt || { echo "FAIL: build-info.sh wrote no BUILD-INFO-WINDOWS.txt into $(pwd)" >&2; exit 1; }
          grep -q '^artifact_sha256:' BUILD-INFO-WINDOWS.txt || { echo "FAIL: BUILD-INFO-WINDOWS.txt carries no artifact_sha256, so the release gate cannot match the binary it publishes" >&2; exit 1; }
          printf '%s  %s\n' "$sha256" "$ARTIFACT_NAME" > "$ARTIFACT_NAME.sha256"
          cp ../LICENSE LICENSE
          cat SHA256SUMS

      - name: Package the loader-consumable artifact
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # No unstripped/control builds to clean up any more: the symbol-audit links were removed,
          # so dist holds only the artifact and its records by the time this runs.
          # ARTIFACT_NAME is already sing-box.exe, and `cp x x` fails; only copy if the
          # built name differs from the name the loader expects inside the zip.
          [ "$ARTIFACT_NAME" = "sing-box.exe" ] || cp "$ARTIFACT_NAME" sing-box.exe
          zip -q "$ZIP_NAME" sing-box.exe SHA256SUMS build-info.json
          unzip -l "$ZIP_NAME"

      - name: Verify the zip is exactly the bytes that were built
        shell: bash
        run: |
          set -euo pipefail
          # The zip is a transport wrapper for an external loader, NOT a release deliverable:
          # the release gate ships the bare `sing-box.exe` under its own name, and refuses any
          # unlisted `*.zip` in the tree. It is re-expanded and checked here because the loader
          # consumes it as-is, so it still has to be exactly the bytes that were built.
          cd dist
          rm -rf _verify && mkdir _verify
          unzip -q "$ZIP_NAME" -d _verify

          # Both sides sorted: find|sort is ASCII-ordered, so an unsorted expected list
          # never matches even when the contents are correct.
          expected="$(printf '%s\n' build-info.json SHA256SUMS sing-box.exe | sort)"
          actual="$(cd _verify && find . -type f | sed 's|^\./||' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "FAIL: the zip does not contain exactly the expected files" >&2
            echo "expected:" >&2; printf '%s\n' "$expected" >&2
            echo "actual:" >&2;   printf '%s\n' "$actual" >&2
            exit 1
          fi

          cmp sing-box.exe _verify/sing-box.exe
          cmp build-info.json _verify/build-info.json
          ( cd _verify && sha256sum -c SHA256SUMS )
          rm -rf _verify

          zip_sha="$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)"
          zip_size="$(stat -c %s "$ZIP_NAME")"
          echo "zip verification: PASS (contents byte-identical, internal SHA256SUMS valid)"
          echo "zip          : $ZIP_NAME"
          echo "zip size     : $zip_size"
          echo "zip sha256   : $zip_sha"
          {
            echo "ZIP_SHA256=$zip_sha"
            echo "ZIP_SIZE=$zip_size"
          } >> "$GITHUB_ENV"

      - name: Summarise
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Windows amd64 core"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| version | \`$JJ_VERSION\` |"
            echo "| source_ref | \`$SOURCE_REF\` |"
            echo "| source_commit | \`$SOURCE_COMMIT\` |"
            echo "| workflow_commit | \`$WORKFLOW_COMMIT\` |"
            echo "| target | \`$GOOS_TARGET/$GOARCH_TARGET\`, CGO_ENABLED=0 |"
            echo "| go | $(go version | awk '{print $3}') |"
            echo "| Native Naive | COMPILED (protocol/naive/outbound.go selected by with_naive_outbound) |"
            echo "| MASQUE | COMPILED (protocol/masque in the package graph) |"
            echo "| build tags | verified against the artifact's own embedded metadata |"
            echo "| sing-box.exe | $(stat -c %s dist/sing-box.exe) bytes, \`$(sha256sum dist/sing-box.exe | cut -d' ' -f1)\` |"
            echo "| zip | \`$ZIP_NAME\` $(stat -c %s "dist/$ZIP_NAME") bytes, \`$ZIP_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the core and its records
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPLOAD_NAME }}
          # EXACTLY the four files the release contract names for this platform, and nothing
          # else. The gate's allowlist is derived from its own product table - for Windows that
          # is `sing-box.exe`, `sing-box.exe.sha256`, `BUILD-INFO-WINDOWS.txt` and `LICENSE` -
          # and it refuses the whole tree if anything outside it is present:
          #
          #     FAIL: unexpected file(s) in the release tree:
          #           build-info.json
          #           SHA256SUMS
          #
          # `SHA256SUMS` and `build-info.json` are INTEGRITY RECORDS, not deliverables: they
          # state that the zip and the exe are the bytes that were built, and they are checked
          # here, in "Verify the zip is exactly the bytes that were built". The published
          # artifact does not carry them, and `sing-box.exe.sha256` - written below - is the
          # per-binary checksum the contract actually asks for.
          #
          # The zip is deliberately NOT uploaded either. It is a transport wrapper this
          # workflow verifies and then discards; the contract ships the bare `sing-box.exe`,
          # exactly as server-linux-amd64.yml and client-macos.yml ship their bare binaries.
          # Uploading it alongside the exe put an unlisted `*.zip` in the release tree, which
          # the same allowlist refuses.
          #
          # Of these four, `BUILD-INFO-WINDOWS.txt` is asserted to exist by the step above (and
          # to carry the `artifact_sha256` line the gate matches the binary against). The other
          # three are outputs of the build, the checksum write and the LICENSE copy, all of
          # which run under `set -euo pipefail` earlier in the job, so `if-no-files-found: error`
          # here is a backstop rather than the check.
          path: |
            dist/${{ env.ARTIFACT_NAME }}
            dist/${{ env.ARTIFACT_NAME }}.sha256
            dist/BUILD-INFO-WINDOWS.txt
            dist/LICENSE
          if-no-files-found: error
          retention-days: 30
