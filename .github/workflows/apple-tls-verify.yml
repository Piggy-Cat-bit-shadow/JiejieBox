name: apple-tls-verify

# The Apple TLS engine is darwin+cgo and cannot be exercised on the Windows/Linux hosts used for
# normal development. This gate runs the real Network.framework handshake and the fd-leak cycles on
# a macOS runner. It is not an iOS device test: nw_connection on macOS is the same code path, but a
# device can still differ in entitlement and NetworkExtension behaviour.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # The same selection the Apple GUI pipeline makes: `runs-on` cannot express "this machine while
  # it is awake, the hosted image otherwise". `client-apple.yml` carries the full reasoning and
  # `scripts/ci/apple-runner.sh` is the decision in all three Apple producers.
  select-runner:
    name: select the macOS runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      runner_macos_26: ${{ steps.select.outputs.runner_macos_26 }}
    steps:
      - uses: actions/checkout@v4
      - name: select the Apple runner
        id: select
        env:
          GH_TOKEN: ${{ secrets.APPLE_RUNNER_TOKEN }}
        run: ./scripts/ci/apple-runner.sh

  macos:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Apple TLS handshake and fd-leak tests
        if: matrix.arch == 'arm64'
        run: |
          go test -count=1 -timeout 15m -tags "$(cat release/DEFAULT_BUILD_TAGS)" ./common/tls -run 'TestApple' -v
      - name: Build sing-box for macOS ${{ matrix.arch }}
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
        run: |
          go build -tags "$(cat release/DEFAULT_BUILD_TAGS)" ./...
