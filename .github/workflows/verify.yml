name: Verify

# Gates every push to the long-lived branch on the assumptions this fork makes about the code it pins.
#
# # Why this workflow exists, and what it is not
#
# The artifact workflows are manual dispatch on purpose: they build, sign, smoke-test and upload, and
# a push should not pay 20 minutes for that. But until this workflow existed, NOTHING ran on a push.
# Thirteen commits of local semantic change could sit on `testing` with no verification at all, and
# the fork's riskiest failure mode - upstream changing underneath a local assumption - had no gate
# anywhere.
#
# So this is the cheap half: the tripwires that fail when an upstream revision changes what something
# MEANS, plus the build matrix that fails when it changes what something IS.
#
# # What it runs, stated accurately
#
# The paragraph that used to sit here claimed this workflow "deliberately does not run the full
# unit suite, the race suite or any artifact step; those stay in the artifact workflows where
# they are asked for explicitly." Two of those three claims are still true and one is not, and a
# header that describes a cheaper gate than the workflow is is how the push gate grew without
# anyone deciding to grow it:
#
#   full unit suite   still NOT run here          true
#   artifact steps    still NOT run here          true
#   race suite        RUNS HERE - two steps        was false
#
# The race steps are kept deliberately and the reason is recorded next to them: the artifact
# workflows' race legs sit behind a manual `deep_checks` input, and five of the packages raced
# here are raced nowhere else. What the header can say honestly is the BUDGET: this gate is
# bounded at 40 minutes and is meant to answer "is the source self-consistent, are the pinned
# assumptions still true, and do the main targets still compile" - not "is this a finished
# release candidate". The deep race and interop work belongs to a final-candidate gate, which
# does not exist yet.
on:
  push:
    branches: [testing]
    # A docs-only push must not start an expensive Verify. This is not about concurrency: a
    # report-only commit used to start a second Verify while a real code Verify was still in
    # its build or race stage, and the concurrency group then cancelled the run that mattered,
    # for a commit whose source had not changed. The cost was paid twice - once in cancelled
    # wall clock, and once in a release candidate whose Verify had to be dispatched again.
    #
    # # Why `*.md` and not `docs/**`
    #
    # In GitHub's filter patterns `*` does not match `/`, so `*.md` matches the report files at
    # the REPOSITORY ROOT only - which is where the audit and closure reports land, and where
    # essentially all of the noise comes from.
    #
    # `docs/**` is deliberately NOT ignored, because part of it IS machine-read:
    # `scripts/ci/verify-fork-handoff.sh` parses `docs/fork/upstream-sync-handoff.md` with `sed`
    # and `grep`, reads a `<!-- release-verdict: ... -->` marker out of
    # `docs/fork/v016-final-release-verdict.md`, and checks `docs/fork/v016-release-candidate-manifest.md`
    # for a "not frozen yet" string. A verdict marker is a release input, so a change to those
    # files is not documentation-only. `*.md` cannot reach them, and that is the point.
    #
    # # What is deliberately NOT ignored, and why each one is source identity
    #
    #   .gitmodules, clients/*        a gitlink change changes what the build contains
    #   .github/workflows/**          a gate change must be verified by the gate it changes
    #   scripts/ci/**                 where the gates live
    #   release/**                    JIEJIE_VERSION, build-tag profiles, release inputs
    #   go.mod, go.sum                the build graph
    #   **/*.go, Makefile, Dockerfile the product
    #
    # None of those is listed here, because `paths-ignore` is a subtractive filter: anything
    # not named still triggers. The list below is therefore the COMPLETE set of paths allowed
    # to skip Verify, and it is short on purpose.
    paths-ignore:
      - "*.md"
  pull_request:
    # The same filter, for the same reason and with the same exclusions: a pull request that
    # only adds a report does not need a 40-minute build matrix, and a pull request that
    # touches a markdown file the release gate parses still does - and `*.md` cannot reach
    # those, since they live under `docs/fork/`.
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

# `group` is keyed by the ref AND the event, so a newer push to the same ref supersedes
# the run the previous push started - this is the only workflow a push triggers, and
# finishing a 40-minute structural gate for a commit that has already been replaced is
# pure wall clock.
#
# A manual dispatch is deliberately NOT cancellable: `github.event_name` puts it in a
# group of its own, and `cancel-in-progress` is false for it, so a dispatch can never be
# cancelled by a push, and two dispatches can run at the same time.
#
# A superseded run is not a silent pass. scripts/ci/verify-release-acceptance.sh accepts
# only a COMPLETED SUCCESSFUL run of `verify.yml`/`Verify` at the release commit and
# fails closed on `cancelled`, so if the superseded run was the release candidate's, the
# release fails loudly and the workflow is dispatched again for that commit.
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # The gate self-tests run FIRST, before `setup-go`. They need no Go toolchain, no module
      # download and no network - which is why their notes say they can run on every push - so
      # they were paying for a toolchain install and a module-cache restore to discover, in
      # seconds, that a guard is broken.
      #
      # # The 92-case release-helper suite is NOT run here any more
      #
      # It used to be the first step. It ran here, in release-contract-verify.yml, and again on
      # the publishing runner - three executions of one fact per release - and this was the
      # least valuable of the three: this workflow is the source gate, and the release helper's
      # behavioural contract is not a property of the source.
      #
      # Its primary owner is Release Contract Verification, which runs it on a push that changes
      # release tooling, on a pull request that changes it, and on demand. Formal Release no
      # longer re-runs it either; it requires exact-SHA RCV success instead. So the suite still
      # runs before anything is published - just once, by the workflow that owns it, on the
      # commits where it can have changed.
      #
      # The `verify.yml` self-tests below stay: each is seconds long, needs no network, and
      # guards something this workflow actually does.

      - name: executed-coverage guard self-test
        # The guard that decides whether a step may claim coverage actually ran. It exists because
        # `grep -c '^--- (PASS|FAIL|SKIP):'` counts tests that REPORTED, so an all-SKIP run
        # satisfied it - and the reference suite printed "PASS: reference suite (N differential
        # tests)" over a population that had all declined to run.
        #
        # Its fixtures are the whole point: they prove it fails on an all-SKIP log, on an empty
        # log, and on a log whose filter matched nothing, and that it succeeds on a mixed log. A
        # guard nobody can falsify is a guard nobody can trust. It needs no network and no Go.
        run: ./scripts/ci/require-executed-coverage.test.sh

      # The release ACCEPTANCE gate self-test moved to Release Contract Verification.
      #
      # It used to run here, and that made this workflow the one that DECLARED the acceptance
      # engine as a gate - while the release path never called it. A second may-release authority
      # that nothing on the release path consults is the drift the single-authority rule exists to
      # prevent, and a self-test here kept it looking live.
      #
      # It is now one of Release Contract Verification's release-tooling suites, beside the 92-case
      # helper suite, the workflow-structure checks and the desktop contract tests - the workflow
      # that owns "does the release tooling behave". Its 18 snapshots are unchanged; only its
      # owner moved. The engine itself is unchanged and is still reachable from nothing in the
      # release path.

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd include option protocol route service transport common dns adapter 2>&1 || true)"
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "PASS: gofmt clean"

      - name: client gitlinks match the ABI contract pins
        # The full libbox ABI gate needs cgo and the Darwin profile, so it runs in
        # client-apple.yml against a real client checkout. This half needs only git, and it is
        # the half that catches the failure the knowledge base records as A11: a gitlink move
        # that lands without the verified-SHA constant moving with it.
        #
        # It is not hypothetical. The Apple gitlink advanced from 6e559a4 to 3aedd741 for the
        # v0.1.28 path-monitor canary, the constant stayed at 6e559a4, and nothing noticed
        # because this gate was unwired. A clean run of the full gate would have failed layer 5.
        run: ./scripts/ci/check-libbox-abi.sh --pin-only

      - name: ABI pin gate fails closed on a missing gitlink
        # A gate whose input can be deleted without failing is not a gate. This builds a throwaway
        # repository with both gitlinks, checks --pin-only passes, removes the Apple gitlink, and
        # asserts the same command fails and names the missing client.
        run: ./scripts/ci/test-check-libbox-abi.sh

      - name: gomobile single-source check
        # `github.com/sagernet/gomobile/cmd/gomobile@v0.1.13` used to be written out
        # three times: twice in the Apple workflow and once in the Makefile. Nothing
        # breaks when copies stop agreeing - the build just uses a different
        # generator than the reviewer read - so the check is on the TREE: no version
        # literal outside the one declaration, and every install site going through
        # the script that owns it.
        #
        # The network half (really installing and reading each binary's
        # `go version -m`) is opt-in via GOMOBILE_TOOLCHAIN_TEST_INSTALL=1 and is not
        # run here: it would add a module download to every push for a fact that only
        # changes when the declaration does.
        run: ./scripts/ci/test-gomobile-toolchain.sh

      - name: nested Go module integrity
        # A nested module inherits neither the root module's replaces nor its go.sum, and this
        # repository has two that build or test the product. The guard decides the parity set from
        # the RESOLVED module graph rather than from a hand-written list, and it carries an
        # independent expectation for the load-bearing forks.
        #
        # Both halves are needed. The hand-written list named sing and quic-go and omitted
        # sing-tun, so `test` resolved UPSTREAM sing-tun while the root built the fork carrying the
        # Go TUN stack's Start/Close fix - the tests verified a different object than the one that
        # ships, and the guard reported success. The independent list is what fails when a fork pin
        # is dropped from the root and the nested module at the same time, which the derived rule
        # alone cannot see by construction.
        #
        # --require-checked makes "the test module was actually checked" a condition of passing, so
        # an --exclude that quietly removes it is a failure rather than a smaller green run.
        run: ./scripts/ci/check-go-module-integrity.sh --require-checked test

      - name: nested test module type-checks against this checkout
        # `test/*.go` is `package main` with no `func main`, deliberately: the suites drive the
        # package directly and `go test` generates the entry point. So `go build ./...` inside
        # `test` fails by design ("function main is undeclared in the main package") and is NOT the
        # build check for that module - `go vet ./...` is: it type-checks every package including
        # the test files and links nothing.
        #
        # This is what turns "the test module tests the production sources" into a check. The module
        # replaces github.com/sagernet/sing-box with the working tree, and the step above pins its
        # other dependencies to the same fork revisions the root builds; vetting the whole module
        # here is what proves it still compiles against THIS tree.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          cd test
          go vet -tags "$tags" ./...
          echo "PASS: the test module type-checks against the working tree"

      - name: NetLog parser tests (test module, no native library)
        # The Naive pool-isolation self-test needs a real Cronet engine, which this Linux runner
        # cannot load. Its parser is what turns a NetLog into a session count, and that part is pure
        # Go: it resolves the event id from the file's own constants block instead of a literal
        # (Chromium renumbered HTTP2_SESSION_INITIALIZED from 249 to 267, which is exactly how the
        # self-test came to count zero and pass nothing).
        #
        # Running those cases here keeps that fix from regressing on every push. The native half
        # stays where an engine can actually be loaded.
        run: |
          set -euo pipefail
          cd test
          go test -count=1 -timeout 2m -run 'TestNetLogEventCount' -v .
          echo "PASS: NetLog parser tests"

      - name: build-tag policy and linkname gates
        # cmd/internal/build_libbox owns the tag composition each shipped artifact is compiled with,
        # and the tests next to it are the only thing that notices when a tag moves. They are easy
        # to leave out of a package list because the package is a `main`, so they are run by
        # directory.
        #
        # Two of them are gates on the Go linker contract rather than on a tag list:
        # TestRuntimeLinknamePullsAreGatedOnChecklinkname0 reads the pinned runtime's source to
        # decide which //go:linkname pulls need -checklinkname=0, and
        # TestProfileTagFilesDoNotClaimChecklinkname0 requires the profile tag files to stop claiming
        # that flag. Together they are what keeps a bare `go build ./...` linkable.
        run: go test -count=1 ./cmd/internal/...

      - name: generated schema matches its source
        # `docs/schema.json` is a tracked product artifact consumed outside this repository -
        # the documentation site and an editor schema URL - and no gate compared it with
        # option/schema.go. It had drifted: the `User` definition still advertised `Username`
        # and `Password` after the Go fields carried `json:"username"` / `json:"password"`, so
        # a user following the published schema wrote keys the parser does not accept.
        #
        # The test regenerates through the same schema.Generate the `make schema` target calls,
        # under the canonical tag set, and compares exactly. A source change that alters the
        # schema now fails here instead of surviving until a manual regeneration.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          go test -count=1 -tags "$tags" -run TestTrackedSchemaMatchesTheGenerator ./cmd/sing-box
          echo "PASS: docs/schema.json matches option/schema.go"

      - name: pinned-upstream assumptions
        # The one step that exists for a fork: it fails when an upstream revision changes the meaning
        # of something this fork relies on, and it prints where each assumption lives.
        #
        # Placed AFTER the three cheap gates above on purpose. It runs the tripwire suites under
        # DEFAULT_BUILD_TAGS - which links the cronet profile - and builds ./cmd/ci-artifact-probe
        # to read the probe's provenance, so it is the most expensive step before the builds. A
        # module, tag or linkname break should be named by the seconds-long gate that owns it, not
        # discovered here.
        run: ./scripts/ci/verify-upstream-assumptions.sh

      - name: untagged build of every package
        # `go build ./...` with NO tags is the configuration a reader gets by default and the one
        # `make test` uses first. It did not compile:
        #
        #   transport/http/client.go:239:33: undefined: http3LifecycleTracer
        #   transport/http/stream_error.go:170:5: undefined: classifyH3ErrorCode
        #   transport/http/stream_error.go:170:34: undefined: h3ErrorExpected
        #   transport/masque/session.go:88:31: undefined: transportHTTP.OwnedDatagramSender
        #   transport/masque/server.go:617:19: undefined: transportHTTP.CarriesQuicSemantics
        #   protocol/naive/quic/inbound_init.go:203:12: undefined: newNaiveH3ServerLogger
        #
        # The withheld code was the shared HTTP/3 code table, the optional capability interfaces
        # and the error classifier - none of which is a QUIC runtime dependency. `undefined` is not
        # an acceptable way to express "this build has no QUIC", so the untagged configuration is
        # gated rather than tolerated.
        #
        # `go test -run '^$'` is part of the same gate on purpose. `go build ./...` does not compile
        # test files, and three of them were gated on the wrong thing and failed the untagged build
        # of their own package's test binary (transport/http's strict-fallback test, tailscale's
        # detour-dependency test, common/tls's session-id test). Compiling every test binary is the
        # only cheap way to notice that class of drift; the tests are not run here.
        run: |
          set -euo pipefail
          go build ./...
          echo "PASS: untagged go build ./..."
          go test -run '^$' ./...
          echo "PASS: untagged test binaries compile and link"

      - name: tagged build of every package
        # The server profile - what the Docker image, the Makefile default and build-server.sh all
        # build - with no -ldflags, which is exactly how a reader would build it. This is the gate
        # for "a package whose LINK depends on a flag the tag set does not carry".
        #
        # DEFAULT_BUILD_TAGS (the Darwin profile) is deliberately NOT used here: it carries
        # with_naive_outbound, and no Linux product links cronet. DEFAULT_BUILD_TAGS_OTHERS still
        # exercises the same linker contract on this runner, because
        # experimental/libbox/internal/runtimeinfo pulls runtime.allgs on every GOOS while the
        # Darwin-only signal handler pulls runtime.fwdSig.
        #
        # experimental/libbox was that package. release/DEFAULT_BUILD_TAGS* named
        # tfogo_checklinkname0, the tag whose documented meaning is "this build passes
        # -checklinkname=0", while a bare `go build` links with Go's default policy and cmd/go
        # cannot inject the flag per package:
        #
        #   link: github.com/sagernet/sing-box/experimental/libbox: invalid reference to runtime.fwdSig
        #   link: .../experimental/libbox/internal/runtimeinfo: invalid reference to runtime.allgs
        #
        # The tag now travels with the flag: the mobile builders keep it in
        # cmd/internal/mobilebuildtags and cmd/internal/build_boxdd appends it, because both really
        # do pass -checklinkname=0. The Darwin-only half cannot be linked from this runner (a Darwin
        # cgo binary cannot be cross-linked), so it is guarded structurally by the tag-policy tests
        # in the step above.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          go build -tags "$tags" ./...
          echo "PASS: go build -tags \"$tags\" ./..."

      - name: build matrix
        # A signature change upstream is a build failure here rather than a silent behaviour change
        # later. The main binary is not built for every target: only the packages this fork changes,
        # because the artifact workflows own the products.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS)"
          # The geometry tag is read from the same source of truth the iOS build uses rather than
          # spelled again here. This step previously built with `-tags "$tags,low_memory"`, which is
          # not a build tag anywhere: the sing fork selects its 16 KiB geometry on with_low_memory,
          # so bare low_memory did nothing and this "low_memory" step compiled the standard 32 KiB
          # buffers. Reading it from cmd/internal/appletags means the name cannot drift again, and
          # an empty answer fails the step instead of silently testing the default geometry.
          mobile_tags="$(go run ./cmd/internal/appletags -mobile-only)"
          if [ -z "$mobile_tags" ]; then
            echo "FAIL: could not read the mobile geometry tag from cmd/internal/appletags." >&2
            echo "      Refusing to fall back to a guess: this step would compile the default" >&2
            echo "      geometry while claiming to exercise the low-memory one." >&2
            exit 1
          fi
          packages="./common/trafficclass/... ./common/trafficsched/... ./common/dialer/... ./protocol/direct/... ./protocol/tun/... ./protocol/group/... ./route/... ./option/..."
          for target in linux/amd64 windows/amd64 freebsd/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            echo "--- ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -tags "$tags" $packages
          done
          echo "--- darwin/arm64 ${mobile_tags}"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -tags "$tags,$mobile_tags" ./common/trafficsched/... ./protocol/tun/... ./route/...
          echo "PASS: build matrix"

      # The loadbalance box-level tests (test/loadbalance_group_test.go) are NOT run here.
      #
      # They pass locally and they are the strongest oracle this feature has - a real
      # connection through a real box - but running the test module on a Linux runner trips a
      # PRE-EXISTING goroutine leak in the systemd-resolved DNS transport, and the module's
      # TestMain fails the run on it:
      #
      #   dns/transport/local.(*DBusResolvedResolver).loopUpdateStatus
      #     dns/transport/local/local_resolved_linux.go:349, created by Start (:192)
      #
      # loopUpdateStatus ranges over a channel that only D-Bus would close. Close() shuts the
      # system bus down (:216) but nothing ever closes that channel, so the goroutine blocks
      # for the life of the process. It is unconditional on that path and unrelated to this
      # feature - any box test on a Linux runner with D-Bus systemd-resolved present would do
      # the same - and it is recorded in docs/RELEASE-CERTIFICATE.md rather than worked around
      # here. To run them by hand, on a machine where the leak is not hit or with the resolver
      # disabled:
      #
      #   cd test && go test -tags "$(cat ../release/DEFAULT_BUILD_TAGS_OTHERS)" \
      #     -run 'TestLoadBalance' .

      - name: cronet provenance
        # The fork pin for cronet-go lives in 31 replace directives, and a replace written for
        # one module is not inherited by another: module paths stay upstream so imports need no
        # rewriting, so a missing replace is invisible in the source and links upstream in the
        # binary. This checks the resolved replacements and the archive bytes they provide.
        run: ./scripts/ci/verify-cronet-provenance.sh apple
  race:
    name: race checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: race on the fork's own data paths
        # # Why this is still in the push gate, measured rather than assumed
        #
        # The comment here used to say "the artifact workflows own the full race suite; this is
        # the subset where a fork-local regression would land first". The second half is right
        # and the first half is not, so the decision to keep this step is now recorded from
        # measurement instead of from that claim.
        #
        # Every `-race` invocation in the repository, and what it actually covers:
        #
        #   verify.yml (here)          TRAFFICCLASS, TRAFFICSCHED, DIALER, DIRECT, TUN,
        #                              ROUTE, ADAPTER   - push, every push
        #   server-linux-amd64.yml     masque, http, naive, ROUTE, httpclient
        #                              - workflow_dispatch WITH deep_checks=true
        #   client-macos.yml           masque(x2), http, naive, ROUTE, httpclient, TRAFFICSCHED
        #                              - workflow_dispatch WITH deep_checks=true
        #
        # Capitalised entries are the overlap. Three facts follow, and each one blocks the
        # obvious simplification:
        #
        #   1. The artifact workflows' race steps are gated behind a manual `deep_checks` input,
        #      so they never run on a push. If this step is deleted without another owner, five
        #      packages - trafficclass, dialer, protocol/direct, protocol/tun, adapter - lose
        #      race coverage entirely, and trafficclass in particular is a fork-original
        #      package with no other racer anywhere.
        #   2. The overlap is real but not substitutable. This step races under
        #      release/DEFAULT_BUILD_TAGS; the artifact workflows race under
        #      DEFAULT_BUILD_TAGS_OTHERS. The two lists differ by exactly one tag,
        #      `with_naive_outbound`, and that tag is what makes the Darwin profile link cronet
        #      - so "move it to the product workflow" would silently start racing a different
        #      build configuration and call it the same check.
        #   3. The only correct destination for (1) and (2) is a final-candidate gate that races
        #      the union of these sets once, at the frozen SHA. That gate does not exist.
        #
        # So this step is KEPT, and the action is recorded rather than taken: what is missing is
        # ONE final-candidate race owner covering the union, after which the push-time subsets
        # can be dropped from here and from the artifact workflows' deep legs. Deleting it from
        # here first would remove coverage without moving it, which is the failure mode this
        # comment exists to prevent. It is a MOVE, and the destination is not built yet.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS)"
          go test -race -count=1 -timeout 30m -tags "$tags" ./common/trafficclass/... ./common/trafficsched/... ./common/dialer/... ./protocol/direct/... ./protocol/mieru/... ./protocol/tun/... ./route/... ./adapter/...

      - name: race on the configuration surface
        # The configuration surface is a separate step because the `option` package's TEST
        # binary links cronet (through a naive-related test), and no Linux product links cronet:
        # the server profile is release/DEFAULT_BUILD_TAGS_OTHERS, which has no
        # with_naive_outbound. Running it under the server profile covers every decode, schema
        # and round-trip test in the package, and it is what Linux actually ships.
        #
        # `./option/...` is raced NOWHERE ELSE in this repository - it is not in either artifact
        # workflow's race list - so this step is the sole owner and must not be moved to a
        # product workflow without changing the tags it runs under.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          go test -race -count=1 -timeout 30m -tags "$tags" ./option/...
