name: Release contract verification

# Runs the release gate's own tests on a Linux runner, so the shell and YAML that publish a
# release are exercised before they are trusted with one.
#
# # Why this exists as its own workflow
#
# `scripts/ci/test-release-artifacts.sh` is 1000+ lines of behavioural tests with a mock
# `gh`, and `release.yml` only runs them as a side effect of a real publish - which means a
# defect in them is found during a release, with a tag already cut and a 90-minute wait
# already spent. This workflow runs the same suite plus the version-single-source and asset
# contract suites on every push to a release-related branch, so the answer is known before
# anyone dispatches a release.
#
# # What it must never do
#
# It is read-only and inert by construction, and the last step asserts that rather than
# trusting it:
#
#   * `contents: read` - no write permission is requested anywhere in this file
#   * it publishes nothing and deletes no asset
#   * it moves no tag
#   * it dispatches no publishing workflow
#   * it reads no signing secret
#
# The gate script it calls has a `dry_run` path and a real publishing call; the mock `gh`
# on PATH is what makes the tests unable to reach GitHub at all, and the last step below
# asserts that mock is still wired.

on:
  push:
    branches:
      - testing
      - fix/release-asset-contract
      - "release/**"
    # P1 (trigger narrowing): a push runs this suite only when release TOOLING moved. This
    # workflow owns the behavioural tests for the release helper, the workflows and the
    # release path's shell - so product source, docs and reports are not its input, and a
    # push that touches none of the paths below cannot change its verdict.
    #
    # `workflow_dispatch` is deliberately kept: the final frozen SHA still has to be able to
    # obtain this evidence ON DEMAND, because a `[skip ci]` dependency sync never triggers a
    # push run. Narrowing `push` must not remove that.
    #
    # The list is declared ONCE and aliased below, so the push and pull_request triggers
    # cannot drift into asserting different things about the same files.
    paths: &release_tooling_paths
      - ".github/workflows/release.yml"
      - ".github/workflows/release-contract-verify.yml"
      - ".github/workflows/client-desktop-windows.yml"
      - ".github/workflows/verify.yml"
      - "scripts/ci/release-artifacts.sh"
      - "scripts/ci/test-release-artifacts.sh"
      - "scripts/ci/lib.sh"
      - "scripts/ci/check-release-workflows.py"
      - "scripts/ci/inject-desktop-release-version.py"
      - "scripts/ci/test-desktop-release-version.py"
      - "scripts/ci/prepare-desktop-client.sh"
      - "scripts/ci/check-desktop-source-identity.sh"
      - "scripts/ci/test-desktop-source-identity.sh"
      - "scripts/ci/require-executed-coverage.sh"
      - "scripts/ci/require-executed-coverage.test.sh"
      - "scripts/ci/verify-release-acceptance.sh"
      - "scripts/ci/verify-release-acceptance-test.sh"
      - "scripts/ci/verify-desktop-daemon-provenance.py"
      - "scripts/ci/test-apple-canonical-source.sh"
      - "scripts/ci/apple-libbox-artifact.sh"
      - "scripts/publish-apple-beta.sh"
      - "scripts/ci/version.sh"
      - "release/JIEJIE_VERSION"
  pull_request:
    paths: *release_tooling_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: release helper tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: confirm the toolchain this suite needs
        run: |
          set -euo pipefail
          for tool in bash jq git sha256sum python3 tar; do
            command -v "$tool" >/dev/null 2>&1 || { echo "FAIL: $tool is missing" >&2; exit 1; }
            printf '%-8s %s\n' "$tool" "$(command -v "$tool")"
          done
          bash --version | head -1
          jq --version
          python3 --version

      - name: release gate tests (the existing 1000+-line suite, really executed)
        run: |
          set -uo pipefail
          mkdir -p verify-logs
          # Both streams to one file, and the status carried by hand: the point is that a
          # FAILING run leaves its output as an artifact, because the job log needs a token.
          #
          # Not traced. `set -x` was needed once, to find a fixture builder that died inside a
          # command substitution and therefore printed nothing - but it buries the gate's own
          # error message in shell noise, and the gate's message is what these cases are
          # about. The trace can be turned back on temporarily if another silent death
          # appears.
          set +e
          ./scripts/ci/test-release-artifacts.sh > verify-logs/release-gate.log 2>&1
          rc=$?
          set -e
          cat verify-logs/release-gate.log
          echo "release-gate exit status: $rc"
          echo "$rc" > verify-logs/release-gate.exit
          exit "$rc"

      - name: canonical Libbox source selection (PRESENT_INVALID cannot fall back)
        # The rule this proves is the one the whole Apple supply chain rests on:
        #
        #   canonical Release asset PRESENT, any validation failure  ->  HARD FAIL, never fall back
        #   canonical Release asset ABSENT                           ->  auto MAY fall back
        #
        # It is a NEGATIVE proof, so a non-zero exit would prove nothing: that also happens when the
        # code falls back to Actions and Actions fails for its own reason. The suite installs a mock
        # `gh` in which every Actions command is a sentinel that records the call, and each
        # PRESENT+INVALID case asserts the sentinel file does NOT exist - plus an ABSENT control that
        # requires it to, so the negatives cannot pass vacuously.
        #
        # Owned here rather than in client-apple.yml because it tests the RELEASE's consumption of
        # the canonical asset, and this is the release-tooling owner. client-apple.yml is
        # manual-only and produces no run on a push, so a suite living there would never execute.
        run: |
          set -uo pipefail
          mkdir -p verify-logs
          set +e
          ./scripts/ci/test-apple-canonical-source.sh > verify-logs/canonical-source.log 2>&1
          rc=$?
          set -e
          cat verify-logs/canonical-source.log
          echo "canonical-source exit status: $rc"
          echo "$rc" > verify-logs/canonical-source.exit
          exit "$rc"

      # A failing suite must say WHY in a place that can be read without credentials. The
      # job log cannot (it needs a token), the artifact cannot (same), and the step name is
      # limited to what the jobs API reports. A `::error::` annotation does not have that
      # limitation: it is surfaced as a check-run annotation, which the public API exposes in
      # full. So the failure reason is published deliberately, in one place, formatted to be
      # read by a person or a script.
      - name: publish the failure reason as a check-run annotation
        if: always()
        run: |
          set -uo pipefail
          log=verify-logs/release-gate.log
          [ -f "$log" ] || { echo "no suite output to summarise"; exit 0; }
          rc="$(cat verify-logs/release-gate.exit 2>/dev/null || echo '?')"
          if [ "$rc" = "0" ]; then
            echo "the suite passed; nothing to annotate"
            exit 0
          fi
          # `set +o pipefail` for the extraction only. `grep ... | head -40` gives grep a
          # SIGPIPE as soon as head has its lines, and under pipefail that non-zero status
          # becomes the STEP's status - so the step that exists to REPORT a failure was
          # itself failing, and the annotation never reached the check run.
          set +o pipefail
          summary="$(grep -A1 -E '^FAIL ' "$log" | head -20 | tr '\n' '~' | cut -c1-3000)"
          if [ -z "$summary" ]; then
            # A run that died before any case reported: the tail names what killed it, which
            # the suite's own output cannot - an exit between two cases prints nothing.
            summary="no FAIL line was printed. TAIL: $(tail -40 "$log" | tr '\n' '~' | cut -c1-3000)"
          fi
          set -o pipefail
          echo "::error title=release gate tests failed (exit $rc)::$summary"
          # And a deterministic marker so a reader can find it without parsing prose.
          echo "RELEASE_GATE_FAILURE_BEGIN"
          set +o pipefail
          grep -A1 -E '^FAIL ' "$log" | head -40
          echo "RELEASE_GATE_FAILURE_END"
          exit 0

      - name: desktop release-version contract tests
        if: always()
        run: |
          set -uo pipefail
          mkdir -p verify-logs
          set +e
          python3 scripts/ci/test-desktop-release-version.py 2>&1 | tee verify-logs/desktop-version.log
          rc="${PIPESTATUS[0]}"
          set -e
          echo "$rc" > verify-logs/desktop-version.exit
          exit "$rc"

      - name: desktop source-identity contract tests
        if: always()
        run: |
          set -uo pipefail
          mkdir -p verify-logs
          set +e
          ./scripts/ci/test-desktop-source-identity.sh 2>&1 | tee verify-logs/desktop-identity.log
          rc="${PIPESTATUS[0]}"
          set -e
          echo "$rc" > verify-logs/desktop-identity.exit
          exit "$rc"

      - name: release acceptance gate self-test
        # Moved here from verify.yml. It is a release-TOOLING suite - it proves that the strict
        # acceptance checker still refuses bad evidence across 18 API snapshots (wrong SHA, queued,
        # in progress, failure, cancelled, a similar-looking workflow name, a skipped or missing
        # required job, a wrong artifact digest, an artifact with no digest, a declared artifact
        # that is absent, a jobs snapshot belonging to another run, missing snapshots, no snapshot
        # directory) - so this workflow is its owner, not the source gate.
        #
        # Moving it also removed a claim that was not true: while verify.yml ran this step,
        # verify.yml was DECLARING the acceptance engine as a gate, although nothing on the release
        # path called it. A second may-release authority that no release consults is exactly the
        # drift the single-authority rule exists to prevent, and a self-test in the push gate made
        # it look live. The engine is unchanged and is still reachable from nothing in the release
        # path; what changed is which workflow claims to gate on it.
        if: always()
        run: |
          set -uo pipefail
          mkdir -p verify-logs
          set +e
          ./scripts/ci/verify-release-acceptance-test.sh 2>&1 | tee verify-logs/acceptance-self-test.log
          rc="${PIPESTATUS[0]}"
          set -e
          echo "$rc" > verify-logs/acceptance-self-test.exit
          exit "$rc"

      - name: shell syntax of every release-path script
        if: always()
        run: |
          # `set -e` MATTERS HERE and used to be missing. With only `set -uo pipefail`, a failing
          # `bash -n` did not stop the loop: the `echo` on the next line ran regardless, reset `$?`
          # to 0, and the step exited 0 even if EVERY script failed to parse. The gate was declared
          # and registered by check-release-workflows.py while being unable to fail.
          #
          # `if ! bash -n` is used as well as `set -e`, so the failing file's own diagnostics are
          # printed under a header that names it, rather than appearing as a bare abort.
          set -euo pipefail
          mkdir -p verify-logs
          for f in scripts/ci/release-artifacts.sh scripts/ci/lib.sh \
                   scripts/ci/prepare-desktop-client.sh scripts/ci/test-release-artifacts.sh \
                   scripts/ci/check-desktop-source-identity.sh \
                   scripts/ci/test-desktop-source-identity.sh \
                   scripts/ci/require-executed-coverage.sh \
                   scripts/ci/require-executed-coverage.test.sh; do
            if ! bash -n "$f"; then
              echo "FAIL: $f does not parse" >&2
              exit 1
            fi
            echo "syntax OK: $f"
          done

      - name: the workflow files parse and keep their guards
        if: always()
        run: |
          set -uo pipefail
          mkdir -p verify-logs
          python3 scripts/ci/check-release-workflows.py 2>&1 | tee verify-logs/workflow-structure.log

      - name: the suite carries its own mock, so it cannot reach GitHub
        if: always()
        run: |
          set -euo pipefail
          mkdir -p verify-logs
          # The tests put a mock `gh` first on PATH; that mock is what makes them unable to
          # touch a real repository. This asserts the mock is still wired the way the suite
          # depends on, because a suite that silently started using the real `gh` would
          # still look green - and the gate's only irreversible act is publishing.
          grep -q 'MOCK_GH' scripts/ci/test-release-artifacts.sh
          grep -q 'work/bin' scripts/ci/test-release-artifacts.sh
          grep -q 'PATH=' scripts/ci/test-release-artifacts.sh
          echo "PASS: the release gate suite installs and uses its own mock gh"

      - name: upload the verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-contract-verify-logs
          path: verify-logs/
          if-no-files-found: warn
          retention-days: 14
