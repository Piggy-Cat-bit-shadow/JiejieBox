name: Experiment - iOS self-sign compatibility

# PHASE 1 EXPERIMENT. Not part of the release line and not to be merged as-is.
#
# This workflow exists so the self-sign experiments are reproducible without touching any
# official workflow, release gate, TestFlight entry point or key:
#
#   * it runs only on the experiment branch (and on manual dispatch), never on testing/main;
#   * it builds Libbox and the iOS IPA from SOURCE at the experiment's own Apple client SHA,
#     pinned below, so the artifact can be rebuilt from this commit alone;
#   * it produces two artifacts: the full app, and a diagnostic build that keeps only the
#     Packet Tunnel extension, so a launch failure can be attributed rather than guessed at;
#   * it verifies both against a static contract before uploading anything.
#
# Both entry points work: a push to this branch, and `workflow_dispatch` against this ref
# through the API (`gh api .../dispatches -f ref=experiment/ios-selfsign-compat`). The UI's
# dispatch selector only lists the default branch, which is why the push trigger exists.

on:
  push:
    branches:
      - experiment/ios-selfsign-compat
  workflow_dispatch:
    inputs:
      libbox:
        description: 'auto = reuse an existing validated Libbox for this commit, else build one; required = fail when none exists'
        type: choice
        options: [auto, required]
        default: auto

permissions:
  contents: read
  # Reading the Libbox artifact this commit already produced, instead of compiling it again.
  actions: read

env:
  # The Apple client experiment commit. It carries the launch-path fixes this phase tests:
  #   71ea780  survive a missing App Group instead of terminating at launch
  #   9036dec  ask for the embedded packet-tunnel identifier, not the baked base
  APPLE_EXPERIMENT_SHA: ceffc5b743c08de222f869abf918df198c602a8c
  APPLE_CLIENT_DIR: clients/apple
  APPLE_CLIENT_PLATFORM: ios
  # Identity the experiment builds with. Both are passed through one build setting each, and
  # the Xcode project derives every target's identifier from them, which is what keeps the
  # family consistent when a signing tool remaps it.
  APPLE_EXPERIMENT_BASE_BUNDLE_ID: io.jiejiebox.app
  APPLE_EXPERIMENT_APP_GROUP_ID: group.io.jiejiebox.app

jobs:
  ios-selfsign:
    # The client's SwiftPM graph requires Swift tools 6.2, so the image must be one whose Xcode
    # provides it (macos-14 fails at package resolution). `macos-latest` has been queueing this
    # experiment out for hours - "The job was not acquired by Runner of type hosted" - so the
    # build targets the newer image label directly; it is a separate pool from macos-latest.
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: set up Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer" 2>/dev/null || true
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: select the Apple client experiment source
        # The resolver's documented override: APPLE_CLIENT_SHA materialises an exact commit and
        # records it in the run's frozen state file, which the overlay script then asserts
        # against. That is what makes this artifact reproducible from this commit.
        run: |
          set -euo pipefail
          APPLE_CLIENT_SHA="$APPLE_EXPERIMENT_SHA" ./scripts/ci/apple-client-source.sh checkout ios
          actual="$(git -C "$APPLE_CLIENT_DIR" rev-parse HEAD)"
          echo "apple client: $actual"
          test "$actual" = "$APPLE_EXPERIMENT_SHA"
          git -C "$APPLE_CLIENT_DIR" log --oneline -3

      - name: reuse this commit's Libbox if one was already produced
        id: libbox_artifact
        # The single-producer rule: `client-apple.yml` compiles Libbox for a commit and uploads
        # it under `jiejiebox-libbox-<core sha>`. This job consumes that artifact when it exists
        # instead of compiling the same Go bytes a second time.
        #
        # The artifact NAME only decides what to download. Whether it may be used is decided by
        # `apple-libbox-artifact.sh validate`, against the parent-sha and the release version
        # recorded in the manifest - a name is a label, the manifest is evidence.
        env:
          GH_TOKEN: ${{ github.token }}
          LIBBOX_POLICY: ${{ inputs.libbox || 'auto' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(tr -d '[:space:]' < release/JIEJIE_VERSION)"
          reused=false
          for id in $(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=jiejiebox-libbox-$sha&per_page=10" \
                        --jq '.artifacts[] | select(.expired == false) | .id'); do
            echo "candidate Libbox artifact: $id"
            rm -rf build/apple-libbox build/libbox-artifact.zip
            mkdir -p build/apple-libbox
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > build/libbox-artifact.zip
            unzip -q build/libbox-artifact.zip -d build/apple-libbox
            if ./scripts/ci/apple-libbox-artifact.sh validate build/apple-libbox \
                 --parent-sha "$sha" --jj-version "$version"; then
              ./scripts/ci/apple-libbox-artifact.sh install build/apple-libbox "$APPLE_CLIENT_DIR"
              echo "LIBBOX_ARTIFACT_ID=$id" >> "$GITHUB_ENV"
              reused=true
              break
            fi
            echo "artifact $id does not validate for $sha; ignoring it"
          done
          echo "reused=$reused" >> "$GITHUB_OUTPUT"
          if [ "$reused" = true ]; then
            echo "Libbox for $sha came from the artifact this commit already built"
            exit 0
          fi
          if [ "$LIBBOX_POLICY" = required ]; then
            echo "FAIL: no validated Libbox artifact exists for $sha, and the run requires reuse" >&2
            exit 1
          fi
          echo "no validated Libbox artifact for $sha; this run will build one"

      - name: build Libbox for this commit
        if: steps.libbox_artifact.outputs.reused != 'true'
        # The fallback producer. Same commands as the official libbox action, without its pack
        # and release-identity steps: this job links the framework in place.
        run: |
          set -euo pipefail
          ./scripts/ci/gomobile-toolchain.sh install apple
          # The forked cronet-go module is large and is fetched over VCS, so a cold cache can
          # hit a transient 'RPC failed; curl 56 ... early EOF'. One such timeout cancelled an
          # otherwise healthy run 16 minutes in. Retrying is the whole fix; the module graph is
          # identical every time.
          for attempt in 1 2 3; do
            if go mod download all; then
              break
            fi
            echo "go mod download failed (attempt $attempt); retrying"
            sleep $((attempt * 15))
          done
          go mod download all
          export PATH="$(go env GOPATH)/bin:$PATH"
          # Both slices, not just iOS: the canonical artifact is defined as ios-arm64 +
          # macos-arm64, so a producer that emits only one is not an artifact any consumer can
          # validate. The extra slice is the price of being a producer rather than a private
          # compile, and it is paid once per commit.
          APPLE_CLIENT_DIR="$APPLE_CLIENT_DIR" ./scripts/ci/build-apple-libbox.sh both

      - name: publish the Libbox artifact for this commit
        # A second consumer of the same commit must not compile the same Go bytes again, so the
        # producer path publishes the canonical artifact under the same name the official
        # pipeline uses. On the experiment branch this is the only producer there is: the
        # official libbox job refuses the branch because its Apple gitlink is an experiment
        # revision, which is the ABI gate doing its job rather than a reason to weaken it.
        if: steps.libbox_artifact.outputs.reused != 'true'
        run: |
          set -euo pipefail
          ./scripts/ci/apple-libbox-artifact.sh pack \
            "$APPLE_CLIENT_DIR/Libbox.xcframework" dist/apple/libbox
          cat dist/apple/libbox/manifest.json

      - name: upload the Libbox artifact
        if: steps.libbox_artifact.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-libbox-${{ github.sha }}
          path: dist/apple/libbox
          if-no-files-found: error
          retention-days: 14

      - name: apply the personal-test overlays
        # The same overlays the official iOS job applies: the libbox API compatibility patch,
        # the multicast entitlement removal, and the JiejieBox display-name branding.
        run: ./scripts/ci/prepare-apple-client.sh

      - name: build the full experimental IPA
        run: ./scripts/experiment/build-ios-selfsign-ipa.sh dist/apple/experiment/jiejiebox-selfsign-full.ipa

      - name: build the diagnostic IPA (packet tunnel only)
        run: ./scripts/experiment/build-ios-selfsign-ipa.sh --diagnostic dist/apple/experiment/jiejiebox-selfsign-diagnostic.ipa

      - name: verify both artifacts against the self-sign contract
        # Fails the job rather than shipping an artifact whose version, identity or layout is
        # not what this experiment claims. Every assertion there has a failure it prevents.
        run: |
          set -euo pipefail
          version="$(cat release/JIEJIE_VERSION)"
          build="$(printf '%s' "$version" | tr -cd '0-9' | sed -E 's/^0+//')"
          python3 scripts/experiment/verify-selfsign-ipa.py \
            --version "$version" --build "$build" \
            --base "$APPLE_EXPERIMENT_BASE_BUNDLE_ID" --group "$APPLE_EXPERIMENT_APP_GROUP_ID" \
            dist/apple/experiment/jiejiebox-selfsign-full.ipa
          python3 scripts/experiment/verify-selfsign-ipa.py \
            --version "$version" --build "$build" \
            --base "$APPLE_EXPERIMENT_BASE_BUNDLE_ID" --group "$APPLE_EXPERIMENT_APP_GROUP_ID" \
            --diagnostic \
            dist/apple/experiment/jiejiebox-selfsign-diagnostic.ipa

      - name: audit the artifacts
        run: |
          set -euo pipefail
          python3 scripts/experiment/audit-ipa.py dist/apple/experiment/*.ipa \
            | tee dist/apple/experiment/AUDIT.txt

      - name: BUILD-INFO and SHA256
        run: |
          set -euo pipefail
          out="dist/apple/experiment"
          {
            echo "JiejieBox iOS self-sign experiment (phase 1)"
            echo "==========================================="
            echo "version:            $(cat release/JIEJIE_VERSION)"
            echo "configuration:      Release, iphoneos, arm64, UNSIGNED"
            echo "base bundle id:     $APPLE_EXPERIMENT_BASE_BUNDLE_ID"
            echo "app group:          $APPLE_EXPERIMENT_APP_GROUP_ID"
            echo ""
            echo "parent_repo:        https://github.com/Piggy-Cat-bit-shadow/sing-box"
            echo "parent_sha:         $(git rev-parse HEAD)"
            echo "apple_repo:         https://github.com/Piggy-Cat-bit-shadow/sing-box-for-apple"
            echo "apple_sha:          $APPLE_EXPERIMENT_SHA"
            echo ""
            # Where the core bytes came from. One Libbox per commit is the point of phase 2, so
            # an artifact that does not say which Libbox it linked is not attributable.
            if [ "${{ steps.libbox_artifact.outputs.reused }}" = "true" ]; then
              echo "libbox_source:      reused artifact ${LIBBOX_ARTIFACT_ID} (validated against manifest)"
            else
              echo "libbox_source:      built in this run (no validated artifact existed)"
            fi
            echo ""
            echo "This IPA is NOT signed. It carries no provisioning profile and cannot be"
            echo "installed as-is. It exists to be re-signed with a certificate and profile."
            echo ""
            for ipa in "$out"/*.ipa; do
              echo "artifact:           $(basename "$ipa")"
              echo "  size:             $(wc -c < "$ipa") bytes"
              echo "  sha256:           $(shasum -a 256 "$ipa" | cut -d' ' -f1)"
            done
          } > "$out/BUILD-INFO.txt"
          cat "$out/BUILD-INFO.txt"

      - name: upload the experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-ios-selfsign-experiment-${{ github.sha }}
          path: dist/apple/experiment
          if-no-files-found: error
          retention-days: 14

      - name: summary
        run: |
          {
            echo "### iOS self-sign experiment"
            echo ""
            echo "- version: \`$(cat release/JIEJIE_VERSION)\`"
            echo "- parent: \`$(git rev-parse --short HEAD)\`"
            echo "- apple: \`$APPLE_EXPERIMENT_SHA\`"
            echo "- libbox: \`${{ steps.libbox_artifact.outputs.reused == 'true' && format('reused artifact {0}', env.LIBBOX_ARTIFACT_ID) || 'built in this run' }}\`"
            echo "- artifact: \`jiejiebox-ios-selfsign-experiment-${GITHUB_SHA}\`"
            echo ""
            echo "Unsigned: re-sign it with the certificate and profile before installing."
          } >> "$GITHUB_STEP_SUMMARY"

  macos-compile:
    # Phase 1 changed code shared by both Apple products (FilePath, AppConfiguration), and a
    # change that only ever compiles for iOS is not verified for macOS - the branch would break
    # the moment the macOS app is built from it. This job compiles the macOS app from the same
    # Apple commit and the same Libbox artifact, unsigned, and asserts the result. It is a
    # COMPILE check with an artifact, not a launch check: no device or Mac has run it.
    needs: ios-selfsign
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: check out with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: set up Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer" 2>/dev/null || true
          xcodebuild -version

      - name: check out the macOS Apple source at the experiment commit
        run: |
          set -euo pipefail
          dir="build/apple-client-macos"
          rm -rf "$dir"
          git clone --quiet --no-checkout \
            https://github.com/Piggy-Cat-bit-shadow/sing-box-for-apple "$dir"
          git -C "$dir" checkout --quiet "$APPLE_EXPERIMENT_SHA"
          git -C "$dir" submodule update --init --recursive --quiet
          # The overlay and the resolver agree through this file, exactly as in the official
          # macOS job; without it the overlay cannot tell which revision it is looking at.
          {
            echo "APPLE_CLIENT_SHA=$APPLE_EXPERIMENT_SHA"
            echo "APPLE_CLIENT_REPOSITORY=https://github.com/Piggy-Cat-bit-shadow/sing-box-for-apple"
            echo "APPLE_CLIENT_BRANCH=experiment/selfsign-compat"
          } > build/apple-client-source.env
          git -C "$dir" log --oneline -1

      - name: fetch the Libbox artifact for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="$(tr -d '[:space:]' < release/JIEJIE_VERSION)"
          mkdir -p build/apple-libbox
          # Downloaded by NAME through the API rather than from this run's artifacts: the iOS
          # job only uploads when it was the producer, and a consumer run must still find the
          # producer's artifact. The name chooses what to fetch; the manifest decides whether it
          # may be used.
          for id in $(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=jiejiebox-libbox-$sha&per_page=10" \
                        --jq '.artifacts[] | select(.expired == false) | .id'); do
            rm -rf build/apple-libbox build/libbox-artifact.zip
            mkdir -p build/apple-libbox
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > build/libbox-artifact.zip
            unzip -q build/libbox-artifact.zip -d build/apple-libbox
            if ./scripts/ci/apple-libbox-artifact.sh validate build/apple-libbox \
                 --parent-sha "$sha" --jj-version "$version"; then
              echo "using Libbox artifact $id"
              exit 0
            fi
            echo "artifact $id does not validate for $sha"
          done
          echo "FAIL: no validated Libbox artifact exists for $sha" >&2
          exit 1

      - name: install the Libbox artifact
        run: |
          set -euo pipefail
          jj="$(tr -d '[:space:]' < release/JIEJIE_VERSION)"
          ./scripts/ci/apple-libbox-artifact.sh validate build/apple-libbox \
            --parent-sha "${{ github.sha }}" --jj-version "$jj"
          ./scripts/ci/apple-libbox-artifact.sh install build/apple-libbox build/apple-client-macos

      - name: apply the macOS personal-test overlay
        env:
          APPLE_CLIENT_DIR: build/apple-client-macos
          APPLE_CLIENT_PLATFORM: macos
        run: ./scripts/ci/prepare-apple-client.sh

      - name: build the macOS app unsigned
        env:
          APPLE_CLIENT_DIR: build/apple-client-macos
          APPLE_CLIENT_PLATFORM: macos
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/JIEJIE_VERSION)"
          build_number="$(printf '%s' "$version" | tr -cd '0-9' | sed -E 's/^0+//')"
          xcodebuild -resolvePackageDependencies \
            -project "$APPLE_CLIENT_DIR/sing-box.xcodeproj" -scheme SFM \
            -derivedDataPath build/macos-dd >/dev/null 2>&1 || true
          xcodebuild build \
            -project "$APPLE_CLIENT_DIR/sing-box.xcodeproj" \
            -scheme SFM \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/macos-dd \
            -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            BASE_PACKAGE_IDENTIFIER="$APPLE_EXPERIMENT_BASE_BUNDLE_ID" \
            APP_GROUP_IDENTIFIER="$APPLE_EXPERIMENT_APP_GROUP_ID" \
            MARKETING_VERSION="$version" \
            CURRENT_PROJECT_VERSION="$build_number" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            EXPANDED_CODE_SIGN_IDENTITY="" PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            2>&1 | tail -30

      - name: assert the macOS bundle
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < release/JIEJIE_VERSION)"
          build_number="$(printf '%s' "$version" | tr -cd '0-9' | sed -E 's/^0+//')"
          app="$(find build/macos-dd/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)"
          [ -n "$app" ] || { echo "FAIL: no .app was produced" >&2; exit 1; }
          echo "app: $app"
          plist="$app/Contents/Info.plist"
          for key in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion; do
            echo "  $key = $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$version"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$build_number"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$APPLE_EXPERIMENT_BASE_BUNDLE_ID"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/apple/experiment/jiejiebox-macos-selfsign-unsigned.zip
          shasum -a 256 dist/apple/experiment/jiejiebox-macos-selfsign-unsigned.zip

      - name: upload the macOS build
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-macos-selfsign-compile-${{ github.sha }}
          path: dist/apple/experiment/jiejiebox-macos-selfsign-unsigned.zip
          if-no-files-found: error
          retention-days: 14